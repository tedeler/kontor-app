            application/json:
              schema: {$ref: "#/components/schemas/GeheimnisUebersicht"}

  /api/geheimnisse/schutz:
    get:
      tags: [geheimnisse]
      operationId: schutzStatus
      summary: Status des Schutzes der Geheimnisse (geheimnisschutz.md 2.1)
      responses:
        "200":
          description: Status des Schutzes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GeheimnisSchutz"}
    post:
      tags: [geheimnisse]
      operationId: schutzEinschalten
      summary: Schutz mit dem Login-Passwort einschalten (geheimnisschutz.md 2.2)
      description: Prüfreihenfolge geheimnisschutz.md 2.2; falsches Passwort → 403 anmeldung_fehlgeschlagen (Fehlversuch der Bremse), Sperre → 429. Das Passwort erscheint nie in einer Antwort.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SchutzPasswort"}
      responses:
        "200":
          description: Status des Schutzes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GeheimnisSchutz"}
        "409":
          description: "`nicht_eingerichtet`, `schutz_bereits_aktiv`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422": {$ref: "#/components/responses/Validierung"}

  /api/geheimnisse/schutz/ausschalten:
    post:
      tags: [geheimnisse]
      operationId: schutzAusschalten
      summary: Schutz ausschalten; die gemerkte PIN wird gelöscht (geheimnisschutz.md 2.2)
      description: Prüfreihenfolge geheimnisschutz.md 2.2; falsches Passwort → 403 anmeldung_fehlgeschlagen (Fehlversuch der Bremse), Sperre → 429. Das Passwort erscheint nie in einer Antwort.
