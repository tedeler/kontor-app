          description: "`oauth_fehler`, `nur_echtmodus`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: "`validierung`, `oauth_zustand_ungueltig`, `oauth_abgelehnt`, `oauth_scope_fehlt`, `oauth_kein_refresh_token`"
