    post:
      tags: [sync]
      operationId: syncKontoEntscheidung
      summary: Gelöschtes Bankkonto wiederherstellen oder ignorieren (synchronisation.md 16.3)
      description: |
        Nachtrag zu M3 (E-080 bis E-084). Speichert die Entscheidung für den
