      responses:
        "200":
          description: Erklärung
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegelErklaerung"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "422":
          description: "`validierung`, `ausdruck_ungueltig`, `referenz_unbekannt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

