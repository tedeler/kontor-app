        "422":
          description: "`validierung`, `referenz_unbekannt` (`details.empfaenger_ids`)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/import/kmymoney:
    post:
      tags: [import]
      operationId: importKmymoney
      summary: KMyMoney-Datei (.kmy, gzip oder unkomprimiert) importieren
      description: Verhalten wie `kontor.importer.kmymoney.importiere_kmy` (datenmodell.md 10).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datei]
              properties:
                datei:
                  type: string
                  format: binary
                  description: Dateiinhalt; der Dateiname des Teils wird als `dateiname` gespeichert.
      responses:
        "200":
          description: Import erfolgreich (`erfolgreich = true`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportErgebnis"}
        "422":
          description: |
            Fehlendes Feld `datei` → `validierung`. Import fehlgeschlagen →
            `fehler.code` = Code der ersten Fehlermeldung
            (`import_datei_leer`, `import_format_ungueltig`,
            `import_datei_beschaedigt`, `import_inhalt_ungueltig`) und
            `fehler.details` = vollständiges `ImportErgebnis`
            (`erfolgreich = false`). Nichts wurde importiert.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

