              schema:
                type: object
                required: [regeln]
                properties:
                  regeln:
                    type: array
                    items:
                      type: object
                      required: [regel_id, grund, hinweis, anzahl, gesamt]
                      properties:
                        regel_id: {type: integer}
                        grund: {type: string, enum: [keine_buchungen, anzahl, anteil, fenster]}
                        hinweis: {type: string, description: Kurzer Grund für die Oberfläche}
                        anzahl: {type: integer, description: Buchungen mit der Kategorie der Regel (im Fenster bei grund fenster)}
                        gesamt: {type: integer, description: Buchungen des Empfängers in der Trainingsmenge (im Fenster bei grund fenster)}

