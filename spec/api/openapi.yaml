        schemaversion: {type: integer, minimum: 1}
        anzahl:
          type: object
          description: Je Objektart (protokoll.md 2, 9.1) die Anzahl; ab M9 genau diese Schlüssel, ab M5 zusätzlich kredit, wenn die Sicherung Kredite enthält (sicherung.md 2.5), ab M6 postfach, wenn sie Postfächer enthält (sicherung.md 2.6), ab M18 dokument, wenn sie Dokumente enthält (sicherung.md 2.7), ab M20 erwartung, wenn sie Erwartungen enthält (sicherung.md 2.8)
          required: [konto, empfaenger, tag, buchung, regel, verdacht, abstimmung, vorlage]
          additionalProperties: {type: integer, minimum: 0}
        inhalt_sha256: {$ref: "#/components/schemas/Sha256"}
        datenbank_sha256: {$ref: "#/components/schemas/Sha256"}

