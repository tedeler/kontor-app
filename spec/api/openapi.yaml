        "409":
          description: "`nicht_eingerichtet`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422": {$ref: "#/components/responses/Validierung"}

  /api/geheimnisse/entsperren:
    post:
      tags: [geheimnisse]
      operationId: geheimnisseEntsperren
      summary: App-Instanz entsperren (geheimnisschutz.md 2.2)
      description: Prüfreihenfolge geheimnisschutz.md 2.2; falsches Passwort → 403 anmeldung_fehlgeschlagen (Fehlversuch der Bremse), Sperre → 429. Das Passwort erscheint nie in einer Antwort.
      requestBody:
        required: true
        content:
