      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [buchung_id]
              properties:
                buchung_id: {type: integer}
      responses:
        "201":
          description: angehängtes (oder schon vorhandenes gleiches) Dokument
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dokument"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "422": {$ref: "#/components/responses/Validierung"}

  /api/konfiguration:
    get:
      tags: [betrieb]
