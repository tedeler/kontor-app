        schluessel: {type: string, minLength: 1}
        titel: {type: string, minLength: 1}
        text: {type: string, minLength: 1}
        link: {type: [string, "null"]}
        erstellt_am: {$ref: "#/components/schemas/Zeitstempel"}
        gelesen: {type: boolean}
        zustellung:
