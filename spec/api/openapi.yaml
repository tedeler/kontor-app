          schema: {type: integer}
        - name: unterkonten
          in: query
          description: "M11 (datenmodell.md 16.1): mit konto_id auch dessen Unterkonten (Treffer und betrag); ohne konto_id ohne Wirkung"
          schema: {type: boolean, default: false}
        - name: von
          in: query
          description: datum ≥ von
          schema: {type: string, format: date}
        - name: bis
          in: query
          description: datum ≤ bis. von > bis → 422.
          schema: {type: string, format: date}
        - name: betrag_min
          in: query
          description: betrag ≥ betrag_min (Cent, Betrag gemäß datenmodell.md 3.3)
          schema: {type: integer}
        - name: betrag_max
          in: query
          description: betrag ≤ betrag_max. betrag_min > betrag_max → 422.
          schema: {type: integer}
        - name: kategorie_id
          in: query
          description: Nur Buchungen mit mindestens einem Split auf diesem Konto (beliebige Art; mit `unterkategorien=true` auch auf dessen Unterkonten)
          schema: {type: integer}
        - name: unterkategorien
          in: query
          schema: {type: boolean, default: false}
        - name: tag_id
          in: query
          description: Nur Buchungen, die alle angegebenen Tags tragen (mehrfach angebbar, UND-verknüpft)
          schema:
            type: array
            items: {type: integer}
          style: form
          explode: true
        - name: empfaenger_id
          in: query
          schema: {type: integer}
        - name: ohne_empfaenger
          in: query
          description: true = nur Buchungen ohne Empfänger
          schema: {type: boolean, default: false}
        - name: verwendungszweck
          in: query
          description: norm(verwendungszweck) enthält norm(Wert) (datenmodell.md 1)
          schema: {type: string, minLength: 1}
        - name: zweck_gleich
          in: query
          description: "M27 (sammel.md 3): norm(verwendungszweck) = norm(Wert)"
          schema: {type: string, minLength: 1}
        - name: zweck_leer
          in: query
          description: "M27 (sammel.md 3): true = nur Verwendungszweck exakt leer; Vorrang vor zweck_gleich"
          schema: {type: boolean}
        - name: zweck_aehnlich
          in: query
          description: "M27 (sammel.md 3): ein Wort des Werts als Teilzeichenkette von norm(verwendungszweck)"
          schema: {type: string, minLength: 1}
        - name: empfaenger_aehnlich
          in: query
          description: "M27 (sammel.md 3): Empfängername oder Alias mit gemeinsamem ekey-Anfang ≥ 4 Zeichen"
          schema: {type: string, minLength: 1}
        - name: filter
          in: query
          description: "M30 (ausdruecke.md 5): Kontor-Ausdruck im Kontext filter, UND-verknüpft mit den übrigen Parametern; ungültig → 422 ausdruck_ungueltig"
          schema: {type: string, minLength: 1, maxLength: 4000}
        - name: stichtag
          in: query
          description: "M30 (ausdruecke.md 2.4): Bezugstag relativer Datumsangaben in filter; Vorgabe heute nach der Uhr der App"
          schema: {type: string, format: date}
        - name: suche
          in: query
          description: Freitext. Treffer, wenn norm(Wert) in norm(x) enthalten ist für mindestens ein x aus Empfängername, Verwendungszweck, Split-Memos, Tag-Namen der Buchung.
          schema: {type: string, minLength: 1}
        - name: status
          in: query
          description: Nur diese Status (mehrfach angebbar, ODER-verknüpft)
          schema:
            type: array
            items: {$ref: "#/components/schemas/Buchungsstatus"}
          style: form
          explode: true
        - name: vorschlag
          in: query
          description: "M2: true = nur Buchungen mit offenem Vorschlag, false = nur ohne (kategorisierung.md 5)"
          schema: {type: boolean}
        - name: abgestimmt
          in: query
          description: "M3: true = nur abgestimmte Buchungen, false = nur nicht abgestimmte (buchhaltungspflege.md 5.5)"
          schema: {type: boolean}
        - name: sortierung
          in: query
          description: |
            `datum`/`-datum`: nach datum; `betrag`/`-betrag`: nach `betrag`;
            `empfaenger`/`-empfaenger`: nach norm(Empfängername), Buchungen
            ohne Empfänger stehen bei aufsteigender wie absteigender Sortierung
            am Ende. Gleichstand: id aufsteigend.
          schema:
            type: string
            enum: [datum, -datum, betrag, -betrag, empfaenger, -empfaenger]
            default: datum
      responses:
        "200":
          description: Datei
          content:
            text/csv:
              schema: {type: string, format: binary}
        "422": {$ref: "#/components/responses/Validierung"}

