            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/mail/nachrichten:
    get:
      tags: [mail]
      operationId: mailNachrichten
      summary: Gespiegelte Nachrichten (mail.md 6.1, ab M27 6.6)
      parameters:
        - name: postfach_id
          in: query
          schema: {type: integer}
        - name: reihenfolge
          in: query
          description: "M27 (mail.md 6.6): aelteste (Vorgabe) oder neueste zuerst"
          schema: {type: string, enum: [aelteste, neueste], default: aelteste}
        - name: zuordnung
          in: query
          description: "M27 (mail.md 6.6): nur Nachrichten dieser Art"
          schema: {type: string, enum: [zugeordnet, erwartet, keine]}
        - name: suche
          in: query
          description: "M32 (sammel3.md 8.1): jedes Wort in Absender, Betreff oder Text (norm)"
          schema: {type: string}
        - name: gruppieren
          in: query
          description: "M32 (sammel3.md 8.4): Mails derselben Zuordnung beieinander, Feld `gruppe`"
          schema: {type: string, enum: [ja, nein], default: nein}
        - name: seite
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: pro_seite
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 50}
      responses:
        "200":
          description: Seite
          content:
            application/json:
