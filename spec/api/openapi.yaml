      additionalProperties: true
      required: [buchung_id]
      properties:
        buchung_id: {$ref: "#/components/schemas/Id"}

    LernUebersicht:
      description: "M31 (lernmodell.md 8.2): Aufbau frei (E-280)"
      type: object
