              schema: {$ref: "#/components/schemas/Fehler"}
        "422": {$ref: "#/components/responses/Validierung"}
    delete:
      tags: [tags]
      operationId: tagLoeschen
      summary: Tag löschen; entfernt nur die Zuordnungen zu Buchungen
