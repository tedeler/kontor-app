              schema: {$ref: "#/components/schemas/Fehler"}
        "422": {$ref: "#/components/responses/Validierung"}

  /api/geheimnisse/sperren:
    post:
      tags: [geheimnisse]
      operationId: geheimnisseSperren
      summary: App-Instanz sperren; Körper wird nicht ausgewertet (geheimnisschutz.md 2.3)
      responses:
        "200":
          description: Status des Schutzes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GeheimnisSchutz"}

  /api/geheimnisse/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
    put:
      tags: [geheimnisse]
      operationId: geheimnisSetzen
      description: Nur ntfy_token und oauth_client_secret. Fehlerantworten enthalten den Wert nie.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeheimnisEingabe"}
      responses:
        "204": {description: Gespeichert (verschlüsselt)}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`geheimnis_schluessel_ungueltig`; ab M23 `geheimnisse_gesperrt` (nicht für ntfy_token)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422": {$ref: "#/components/responses/Validierung"}
    delete:
      tags: [geheimnisse]
      operationId: geheimnisLoeschen
      responses:
        "204": {description: Gelöscht (auch wenn nicht gesetzt)}
        "404": {$ref: "#/components/responses/NichtGefunden"}

