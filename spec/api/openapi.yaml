        buchungen_geloescht: {$ref: "#/components/schemas/IdListeAufsteigend"}
        buchungen_umgebucht: {$ref: "#/components/schemas/IdListeAufsteigend"}
        konfliktbuchungen: {$ref: "#/components/schemas/IdListeAufsteigend"}
        gesperrt: {$ref: "#/components/schemas/IdListeAufsteigend"}
        unterkonten: {$ref: "#/components/schemas/IdListeAufsteigend"}
        regeln_geaendert: {$ref: "#/components/schemas/IdListeAufsteigend"}
        regeln_geloescht: {$ref: "#/components/schemas/IdListeAufsteigend"}
