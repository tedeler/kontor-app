      description: |
        ZIP mit genau `manifest.json` und `kontor.sqlite`. Ohne
        Änderungsprotokoll und ohne Geheimnisse. Header
        `Content-Disposition: attachment; filename="kontor-sicherung-<modus>-<JJJJMMTT>T<HHMMSS>Z.zip"`.
        Erzeugt keine Änderung.
      responses:
        "200":
          description: ZIP-Datei
          content:
            application/zip:
              schema: {type: string, format: binary}

  /api/sicherung/einspielen:
    post:
      tags: [sicherung]
      operationId: sicherungEinspielen
      summary: Sicherung einspielen; ersetzt den gesamten fachlichen Zustand (sicherung.md 5)
      description: |
        Prüfreihenfolge: 422 `validierung`, 422 `sicherung_ungueltig`
        (`details.grund`), 409 `sicherung_modus`, dann nur ohne `trocken`:
        409 `bestaetigung_erforderlich`, 409 `sync_laeuft` bzw.
        `tan_ausstehend`. Atomar; bei Erfolg mit Unterschied genau eine
        Änderung `sicherung_einspielen`, bei identischem Inhalt keine.
      parameters:
        - name: trocken
          in: query
          required: false
          schema: {type: boolean, default: false}
        - name: bestaetigt
          in: query
          required: false
          schema: {type: boolean, default: false}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datei]
              properties:
                datei:
                  type: string
                  format: binary
                  description: ZIP-Datei einer Sicherung
      responses:
        "200":
          description: Eingespielt, identisch oder Probelauf
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SicherungErgebnis"}
        "409":
          description: "`sicherung_modus`, `bestaetigung_erforderlich`, `sync_laeuft`, `tan_ausstehend`; D-302: `mail_abruf_laeuft`, `sicherung_vorher_fehlgeschlagen`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: |
            `validierung`; `sicherung_ungueltig` mit `details = {"grund": …}`,
            `grund` ∈ {datei_leer, kein_zip, zip_inhalt, manifest_ungueltig,
            format_unbekannt, version_nicht_unterstuetzt, datenbank_pruefsumme,
            datenbank_ungueltig, datenbank_fremd, inhalt_ungueltig,
            inhalt_pruefsumme}. Nichts wurde geändert.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

