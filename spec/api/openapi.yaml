        anzahl: {type: integer, minimum: 0}
        anzahl_kategorie: {type: integer, minimum: 0}
        anzahl_vergleich: {type: integer, minimum: 0}
        faktor_promille: {type: [integer, "null"], minimum: 0}

    LernAehnlich:
