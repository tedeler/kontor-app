        korrektur_buchung:
          oneOf:
            - {$ref: "#/components/schemas/Buchung"}
            - {type: "null"}
        abgeglichen_buchung_ids:
          type: array
          items: {$ref: "#/components/schemas/Id"}

    WiederkehrendSerie:
      type: object
      additionalProperties: false
      required: [schluessel, konto_id, empfaenger, richtung, rhythmus, anzahl, erste, letzte, betrag, jahreskosten,
                 naechste_faelligkeit, status, buchung_ids]
      properties:
        schluessel: {type: string, pattern: "^[0-9]+:[0-9]+:(ausgabe|einnahme)$"}
        konto_id: {$ref: "#/components/schemas/Id"}
        empfaenger: {$ref: "#/components/schemas/EmpfaengerKurz"}
        richtung: {type: string, enum: [ausgabe, einnahme]}
        rhythmus: {type: string, enum: [monatlich, vierteljaehrlich, jaehrlich]}
        anzahl: {type: integer, minimum: 2}
        erste: {$ref: "#/components/schemas/Datum"}
        letzte: {$ref: "#/components/schemas/Datum"}
        betrag: {type: integer}
        jahreskosten: {type: integer}
        naechste_faelligkeit: {$ref: "#/components/schemas/Datum"}
        status: {type: string, enum: [aktiv, ausbleibend, beendet]}
        buchung_ids:
          type: array
          minItems: 2
          items: {$ref: "#/components/schemas/Id"}

    WiederkehrendUebersicht:
      type: object
      additionalProperties: false
      required: [stichtag, serien, summe_jahreskosten]
      properties:
        stichtag: {$ref: "#/components/schemas/Datum"}
        serien:
          type: array
          items: {$ref: "#/components/schemas/WiederkehrendSerie"}
        summe_jahreskosten: {type: integer}

    WiederkehrendPruefen:
      type: object
      additionalProperties: false
      properties:
        buchung_ids:
          type: array
          maxItems: 10000
          items: {type: integer}
          default: []

    WiederkehrendPruefung:
      type: object
      additionalProperties: false
      required: [stichtag, benachrichtigungen]
      properties:
        stichtag: {$ref: "#/components/schemas/Datum"}
        benachrichtigungen:
          type: array
          items: {$ref: "#/components/schemas/Benachrichtigung"}

    KontostandReihe:
      type: object
      additionalProperties: false
      required: [konto_id, name, art, werte]
      properties:
        konto_id: {$ref: "#/components/schemas/Id"}
        name: {type: string}
        art: {$ref: "#/components/schemas/Kontoart"}
        werte:
          type: array
          items: {type: integer}

    KontostandBericht:
      type: object
      additionalProperties: false
      required: [von, bis, intervall, unterkonten, stichtage, reihen]
      properties:
        von: {$ref: "#/components/schemas/Datum"}
        bis: {$ref: "#/components/schemas/Datum"}
        intervall: {type: string, enum: [tag, woche, monat, jahr]}
        unterkonten: {type: boolean}
        stichtage:
          type: array
          minItems: 1
          maxItems: 5000
          items: {$ref: "#/components/schemas/Datum"}
        reihen:
          type: array
          items: {$ref: "#/components/schemas/KontostandReihe"}

    EinnahmenAusgabenSumme:
      type: object
      additionalProperties: false
      required: [einnahmen, ausgaben, saldo, nicht_kategorisiert]
      properties:
        einnahmen: {type: integer}
        ausgaben: {type: integer}
        saldo: {type: integer}
        nicht_kategorisiert: {type: integer}

    EinnahmenAusgabenPeriode:
      type: object
      additionalProperties: false
      required: [von, bis, einnahmen, ausgaben, saldo, nicht_kategorisiert]
      properties:
        von: {$ref: "#/components/schemas/Datum"}
        bis: {$ref: "#/components/schemas/Datum"}
        einnahmen: {type: integer}
        ausgaben: {type: integer}
        saldo: {type: integer}
        nicht_kategorisiert: {type: integer}

    KategorieSumme:
      type: object
      additionalProperties: false
      required: [kategorie_id, name, art, summe]
      properties:
        kategorie_id: {$ref: "#/components/schemas/Id"}
        name: {type: string}
        art: {type: string, enum: [aufwand, ertrag]}
        summe: {type: integer}

    EinnahmenAusgabenBericht:
      type: object
      additionalProperties: false
      required: [von, bis, intervall, perioden, gesamt, kategorien]
      properties:
        von: {$ref: "#/components/schemas/Datum"}
        bis: {$ref: "#/components/schemas/Datum"}
        intervall: {type: string, enum: [tag, woche, monat, jahr]}
        perioden:
          type: array
          minItems: 1
          maxItems: 5000
          items: {$ref: "#/components/schemas/EinnahmenAusgabenPeriode"}
        gesamt: {$ref: "#/components/schemas/EinnahmenAusgabenSumme"}
        kategorien:
          type: array
          items: {$ref: "#/components/schemas/KategorieSumme"}
        sonderposten: {$ref: "#/components/schemas/SonderpostenAbschnitt"}

    SonderpostenAbschnitt:
      description: >-
        D-300 (berichte.md 7): Buchungen mit dem Tag „Sonderposten“ im Zeitraum des Berichts. Mit `modus` = `ohne`
        zählen sie in den übrigen Zahlen nicht mit.
      type: object
      additionalProperties: false
      required: [modus, tag_id, anzahl, ausgaben, einnahmen, eintraege]
      properties:
        modus: {type: string, enum: [ohne, mit]}
        tag_id: {type: [integer, "null"]}
        anzahl: {type: integer, minimum: 0}
        ausgaben: {type: integer, description: Beitrag zu den Ausgaben in Cent (Erstattungen mindern)}
        einnahmen: {type: integer}
        eintraege:
          type: array
          items: {type: object}

    AnmeldeStatus:
      type: object
      additionalProperties: false
      required: [aktiv, eingerichtet, angemeldet, csrf_token, sitzung_ablauf, gesperrt_bis]
      properties:
        aktiv: {type: boolean}
        eingerichtet: {type: boolean}
        angemeldet: {type: boolean}
        csrf_token:
          type: [string, "null"]
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        sitzung_ablauf:
          oneOf:
            - {$ref: "#/components/schemas/Zeitstempel"}
            - {type: "null"}
        gesperrt_bis:
          oneOf:
            - {$ref: "#/components/schemas/Zeitstempel"}
            - {type: "null"}

    AnmeldeEingabe:
      type: object
      additionalProperties: false
      required: [passwort]
      properties:
        passwort: {type: string, minLength: 1, maxLength: 4096}

    EinrichtungEingabe:
      type: object
      additionalProperties: false
      required: [einrichtungscode, passwort]
      properties:
        einrichtungscode: {type: string, minLength: 1, maxLength: 64}
        passwort: {type: string, minLength: 1, maxLength: 4096}

    PasswortAenderung:
      type: object
      additionalProperties: false
      required: [altes_passwort, neues_passwort]
      properties:
        altes_passwort: {type: string, minLength: 1, maxLength: 4096}
        neues_passwort: {type: string, minLength: 1, maxLength: 4096}

    Versionsangaben:
      type: object
      additionalProperties: false
      description: Antwort von GET /api/version (version.md 3.2, E-178)
      required: [name, version, commit, build_datum, entwicklungsstand, python, repository, modus, datenbank,
                 datenbank_schema, sicherung_schema]
      properties:
        name: {type: string, const: Kontor}
        version:
          type: string
          pattern: "^(0|[1-9][0-9]*)\\.([0-9]{2}|[1-9][0-9]{2,})$"
          description: MAJOR.MINOR nach version.md 1.1
        commit:
          type: [string, "null"]
          pattern: "^[0-9a-f]{7,40}$"
          description: gekürzter Commit-Hash des Release-Builds; null ohne Release-Build
        build_datum:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"
          description: Zeitpunkt des Builds in UTC; null ohne Release-Build
        entwicklungsstand:
          type: boolean
          description: true genau dann, wenn commit und build_datum null sind
        python: {type: string, minLength: 1}
        repository:
          type: string
          pattern: "^https://[^/@:?#\\s]+(:[0-9]+)?(/[^\\s]*)?$"
        modus:
          type: string
          enum: [mock, echt]
        datenbank:
          type: string
          minLength: 1
          description: absoluter Pfad der aktiven Datenbankdatei
        datenbank_schema: {type: integer, minimum: 1}
        sicherung_schema: {type: integer, minimum: 1}

    Gesundheit:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: {type: string, enum: [ok]}
        version: {type: string, minLength: 1}

    # ---------------------------------------------------------------- M16: Begründung (wiederkehrend.md 8)
    # ---------------------------------------------------------------- M25: Betragsfilter (wiederkehrend.md 9)
    Betragsfilter:
      type: object
      additionalProperties: false
      required: [modus]
      properties:
        modus: {type: string, enum: [aus, toleranz, mindestschwelle]}
        toleranz_prozent: {type: [integer, "null"]}
        mindestbetrag: {type: [integer, "null"]}

    BetragsfilterVorgabe:
      type: object
      additionalProperties: false
      required: [modus, toleranz_prozent]
      properties:
        modus: {type: string, enum: [aus, toleranz]}
        toleranz_prozent: {type: [integer, "null"], minimum: 0, maximum: 100}

    BetragsfilterWerte:
      type: object
      additionalProperties: false
      required: [modus, toleranz_prozent, mindestbetrag]
      properties:
        modus: {type: string, enum: [aus, toleranz, mindestschwelle]}
        toleranz_prozent: {type: [integer, "null"], minimum: 0, maximum: 100}
        mindestbetrag: {type: [integer, "null"], minimum: 1, maximum: 999999999999}

    BetragsfilterAngabe:
      type: object
      additionalProperties: false
      required: [modus, toleranz_prozent, mindestbetrag, quelle]
      properties:
        modus: {type: string, enum: [aus, toleranz, mindestschwelle]}
        toleranz_prozent: {type: [integer, "null"], minimum: 0, maximum: 100}
        mindestbetrag: {type: [integer, "null"], minimum: 1, maximum: 999999999999}
        quelle: {type: string, enum: [vorgabe, empfaenger]}

    EmpfaengerBetragsfilter:
      type: object
      additionalProperties: false
      required: [empfaenger, modus, toleranz_prozent, mindestbetrag]
      properties:
        empfaenger: {$ref: "#/components/schemas/BegruendungKonto"}
        modus: {type: string, enum: [aus, toleranz, mindestschwelle]}
        toleranz_prozent: {type: [integer, "null"], minimum: 0, maximum: 100}
        mindestbetrag: {type: [integer, "null"], minimum: 1, maximum: 999999999999}

    WiederkehrendEinstellungen:
      type: object
      additionalProperties: false
      required: [vorgabe, empfaenger]
      properties:
        vorgabe: {$ref: "#/components/schemas/BetragsfilterVorgabe"}
        empfaenger:
          type: array
          description: nur Empfänger mit eigener Einstellung, nach Name, dann ID
          items: {$ref: "#/components/schemas/EmpfaengerBetragsfilter"}

    EmpfaengerZustand:
      type: object
      additionalProperties: false
      description: "Protokollform eines Empfängers ab M25: wie Empfaenger, mit `wiederkehrend` nur bei eigener Einstellung (wiederkehrend.md 9.4)"
      required: [id, name, extern_id, wiederkehrend]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string, minLength: 1}
        extern_id: {type: [string, "null"]}
        aliase:
          type: array
          items: {type: string, minLength: 1}
        standardkategorie_id:
          oneOf:
            - {$ref: "#/components/schemas/Id"}
            - {type: "null"}
        wiederkehrend: {$ref: "#/components/schemas/BetragsfilterWerte"}
        tags:
          description: "M27 (sammel.md 2): Tags des Empfängers nach (name, id); fehlt ohne Tags"
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/TagKurz"}
        lernregel_gesperrt:
          description: "M31 (lernmodell.md 9.4): nur bei gesperrten Empfängern, dann `true`; seit D-305 nur noch aus früheren Beständen, ohne Wirkung"
          const: true

    BegruendungVerweis:
      type: object
      additionalProperties: false
      required: [buchung_id, datum, betrag]
      properties:
        buchung_id: {$ref: "#/components/schemas/Id"}
        datum: {$ref: "#/components/schemas/Datum"}
        betrag: {$ref: "#/components/schemas/Betrag"}

    BegruendungKonto:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string}

    WiederkehrendBegruendung:
      type: object
      additionalProperties: false
      required: [buchung_id, stichtag, urteil, text, eintraege, ausgeschlossen]
      properties:
        empfaenger:
          description: "ab M25 (wiederkehrend.md 9.3.5): Empfänger der Buchung oder null; im Schema optional"
          oneOf:
            - {$ref: "#/components/schemas/BegruendungKonto"}
            - {type: "null"}
        buchung_id: {$ref: "#/components/schemas/Id"}
        stichtag: {$ref: "#/components/schemas/Datum"}
        urteil: {type: string, enum: [wiederkehrend, zusaetzlich, nicht_wiederkehrend, ausgeschlossen]}
        text: {type: string, minLength: 1, description: "Inhalt nicht Teil der Abnahme"}
        eintraege:
          type: array
          items: {$ref: "#/components/schemas/BegruendungEintrag"}
        ausgeschlossen:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [konto, grund, text]
            properties:
              konto: {$ref: "#/components/schemas/BegruendungKonto"}
              grund: {type: string, enum: [darlehenskonto, summe_null]}
              text: {type: string, minLength: 1}

    BegruendungEintrag:
      type: object
      additionalProperties: false
      required: [konto, richtung, datum, betrag, gruppe, gruppe_anzahl, juengste, urteil, glied, text, serie,
                 rhythmen, buchungen]
      properties:
        konto: {$ref: "#/components/schemas/BegruendungKonto"}
        richtung: {type: string, enum: [ausgabe, einnahme]}
        datum: {$ref: "#/components/schemas/Datum"}
        betrag: {$ref: "#/components/schemas/Betrag"}
        gruppe: {type: string, minLength: 1, description: "Konto · Empfänger · Richtung; Text nicht Teil der Abnahme"}
        gruppe_anzahl: {type: integer, minimum: 1}
        juengste: {$ref: "#/components/schemas/BegruendungVerweis"}
        urteil: {type: string, enum: [glied, zusaetzlich, vor_beginn, keine_serie, anderer_betrag]}
        glied: {type: [integer, "null"], minimum: 1}
        text: {type: string, minLength: 1}
        betragsfilter:
          description: "ab M25: der für die Gruppe geltende Betragsfilter; im Schema optional"
          $ref: "#/components/schemas/BetragsfilterAngabe"
        betragsfilter_text:
          description: "ab M25, z. B. „Betragsfilter: Toleranz ±10 % (Vorgabe)“; im Schema optional"
          type: string
          minLength: 1
        serie:
          oneOf:
            - {$ref: "#/components/schemas/WiederkehrendSerie"}
            - {type: "null"}
        rhythmen:
          type: array
          minItems: 1
          maxItems: 3
          items: {$ref: "#/components/schemas/BegruendungRhythmus"}
        buchungen:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [buchung_id, datum, betrag, rolle, glied]
            properties:
              buchung_id: {$ref: "#/components/schemas/Id"}
              datum: {$ref: "#/components/schemas/Datum"}
              betrag: {$ref: "#/components/schemas/Betrag"}
              rolle: {type: string, enum: [glied, zusaetzlich, vor_beginn, keine_serie, anderer_betrag]}
              glied: {type: [integer, "null"], minimum: 1}

    BegruendungRhythmus:
      type: object
      additionalProperties: false
      required: [rhythmus, monate, mindestanzahl, laenge, erfuellt, schritte]
      properties:
        rhythmus: {type: string, enum: [monatlich, vierteljaehrlich, jaehrlich]}
        monate: {type: integer, enum: [1, 3, 12]}
        mindestanzahl: {type: integer, minimum: 2}
        laenge:
          type: integer
          minimum: 0
          description: "ab M25 auch 0, wenn kein Eintrag der Gruppe zugelassen ist (Mindestschwelle, E-240)"
        erfuellt: {type: boolean}
        schritte:
          type: array
          description: "ab M25 leer, wenn kein Eintrag der Gruppe zugelassen ist (E-240)"
          items: {$ref: "#/components/schemas/BegruendungSchritt"}

    BegruendungSchritt:
      type: object
      additionalProperties: false
      required: [ergebnis, grund, von, vorgaenger, erwartet, abweichung_tage, uebersprungen, fremd, kandidaten, text]
      properties:
        ergebnis: {type: string, enum: [anker, verbunden, bruch]}
        grund:
          type: [string, "null"]
          enum: [kein_vorgaenger, abstand, fremde_zahlung, betrag, null]
        von: {$ref: "#/components/schemas/BegruendungVerweis"}
        vorgaenger:
          oneOf:
            - {$ref: "#/components/schemas/BegruendungVerweis"}
            - {type: "null"}
        erwartet:
          oneOf:
            - {$ref: "#/components/schemas/Datum"}
            - {type: "null"}
        abweichung_tage: {type: [integer, "null"]}
        uebersprungen:
          type: array
          items: {$ref: "#/components/schemas/BegruendungVerweis"}
        fremd:
          oneOf:
            - {$ref: "#/components/schemas/BegruendungVerweis"}
            - {type: "null"}
        kandidaten:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [buchung_id, datum, betrag, laenge, gleicher_betrag]
            properties:
              buchung_id: {$ref: "#/components/schemas/Id"}
              datum: {$ref: "#/components/schemas/Datum"}
              betrag: {$ref: "#/components/schemas/Betrag"}
              laenge: {type: integer, minimum: 1}
              gleicher_betrag: {type: boolean}
        text: {type: string, minLength: 1}

    # ---------------------------------------------------------------- M18 Dokumente (dokumente.md)
    Dokumenttyp:
      type: string
      enum: [application/pdf, image/jpeg, image/png, image/webp, message/rfc822]

    DokumentZustand:
      type: object
      additionalProperties: false
      description: Protokollform eines Dokuments (protokoll.md 15.1, dokumente.md 3.1)
      required: [id, dateiname, mime_typ, groesse, sha256, quelle, erstellt_am]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        dateiname: {type: string, minLength: 1, maxLength: 200}
        mime_typ: {$ref: "#/components/schemas/Dokumenttyp"}
        groesse: {type: integer, minimum: 1}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        quelle: {type: string, enum: [upload, kamera, mail]}
        erstellt_am: {$ref: "#/components/schemas/Zeitstempel"}

    Dokument:
      type: object
      additionalProperties: false
      description: Dokument (dokumente.md 1.1); buchung_ids nur in REST-Antworten
      required: [id, dateiname, mime_typ, groesse, sha256, quelle, erstellt_am, buchung_ids]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        dateiname: {type: string, minLength: 1, maxLength: 200}
        mime_typ: {$ref: "#/components/schemas/Dokumenttyp"}
        groesse: {type: integer, minimum: 1}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        quelle: {type: string, enum: [upload, kamera, mail]}
        erstellt_am: {$ref: "#/components/schemas/Zeitstempel"}
        buchung_ids:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Id"}

    DokumentListe:
      type: object
      additionalProperties: false
      required: [eintraege]
      properties:
        eintraege:
          type: array
          items: {$ref: "#/components/schemas/Dokument"}

    DokumentAusMail:
      type: object
      additionalProperties: false
      required: [nachricht_id, buchung_ids]
      properties:
        nachricht_id: {type: integer}
        buchung_ids:
          type: array
          minItems: 1
          items: {type: integer}

    DokumentAenderung:
      type: object
      additionalProperties: false
      required: [dateiname]
      properties:
        dateiname: {type: string, minLength: 1}

    DokumentBuchungen:
      type: object
      additionalProperties: false
      required: [buchung_ids]
      properties:
        buchung_ids:
          type: array
          minItems: 1
          items: {type: integer}

    DokumentGeloest:
      type: object
      additionalProperties: false
      required: [dokument_id, buchung_ids, geloescht]
      properties:
        dokument_id: {$ref: "#/components/schemas/Id"}
        buchung_ids:
          type: array
          items: {$ref: "#/components/schemas/Id"}
        geloescht: {type: boolean}

    MailAdresse:
      type: object
      additionalProperties: false
      required: [name, adresse]
      properties:
        name: {type: string}
        adresse: {type: string}

    MailAnhang:
      type: object
      additionalProperties: false
      required: [nr, dateiname, mime_typ, groesse, inline]
      properties:
        nr: {type: integer, minimum: 0}
        dateiname: {type: string, minLength: 1}
        mime_typ: {type: string, minLength: 1}
        groesse: {type: integer, minimum: 0}
        inline: {type: boolean}

    MailAnsicht:
      type: object
      additionalProperties: false
      description: dokumente.md 2.10
      required: [von, an, cc, datum, betreff, text, html, anhaenge]
      properties:
        von: {type: array, items: {$ref: "#/components/schemas/MailAdresse"}}
        an: {type: array, items: {$ref: "#/components/schemas/MailAdresse"}}
        cc: {type: array, items: {$ref: "#/components/schemas/MailAdresse"}}
        datum:
          oneOf:
            - {$ref: "#/components/schemas/Zeitstempel"}
            - {type: "null"}
        betreff: {type: string}
        text: {type: string}
        html: {type: boolean}
        anhaenge: {type: array, items: {$ref: "#/components/schemas/MailAnhang"}}

    # ---------------------------------------------------------------- M19 Kategorien zusammenführen
    KategorienZusammenfuehren:
      type: object
      additionalProperties: false
      required: [quelle_ids, ziel_id]
      properties:
        quelle_ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: {type: integer}
        ziel_id: {type: integer}
        quellen_loeschen: {type: boolean, default: true}
        gesperrte_einbeziehen: {type: boolean, default: false}
        trocken: {type: boolean, default: false}

    ZusammenfuehrenErgebnis:
      type: object
      additionalProperties: false
      required: [ziel_id, quelle_ids, quellen_geloescht, buchungen_umgebucht, konfliktbuchungen, gesperrt,
                 unterkategorien_verschoben, regeln_geaendert, empfaenger_geaendert, extern_id_uebernommen, trocken,
                 aenderung_id]
      properties:
        ziel_id: {$ref: "#/components/schemas/Id"}
        quelle_ids:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Id"}
        quellen_geloescht: {type: boolean}
        buchungen_umgebucht: {type: array, items: {$ref: "#/components/schemas/Id"}}
        konfliktbuchungen: {type: array, items: {$ref: "#/components/schemas/Id"}}
        gesperrt: {type: array, items: {$ref: "#/components/schemas/Id"}}
