openapi: 3.1.0
info:
  title: Kontor REST-API
  version: 2.25.0
  description: |
    REST-Schnittstelle von Kontor, Meilensteine 1 bis 10. Verbindlicher Vertrag
    zwischen Implementierung und Tests. Fachliche Regeln stehen in
    `datenmodell.md`; dieses Dokument legt Pfade, Parameter, Schemas und
    Statuscodes fest.

    Allgemeine Regeln:
    - Alle Beträge sind ganze Cent (JSON-Ganzzahl). Gleitkommazahlen
      (auch `12.0`), Zeichenketten und Booleans an Betragsstellen führen zu 422.
    - Anfragekörper sind JSON-Objekte; unbekannte Felder führen zu 422
      (`additionalProperties: false`).
    - Jede Fehlerantwort unter `/api/` (4xx, 5xx) hat das Schema `Fehler` –
      auch 404 für unbekannte Pfade, 405 für unzulässige Methoden und 422
      bei Validierungsfehlern der Anfrage.
    - Jede Antwort unter `/api/` trägt den Header `X-Kontor-Modus`
      (`mock` oder `echt`).
    - Verweist ein Pfadparameter auf ein nicht existierendes Objekt: 404
      `nicht_gefunden`. Verweist der Anfragekörper auf ein nicht existierendes
      Objekt: 422 `referenz_unbekannt`.
    - Kein Login in Meilenstein 1 bis 4 (später).
    - Meilenstein 2 (Tags sync, tan, benachrichtigungen, mock, regeln):
      fachliche Regeln in `synchronisation.md` und `kategorisierung.md`.
      Erweiterungen bestehender Schemas sind rückwärtskompatibel (E-029).
    - Meilenstein 3 (Tags aenderungen, umbuchungen, abstimmungen, suche;
      Erweiterungen bei empfaenger und buchungen): fachliche Regeln in
      `protokoll.md` und `buchhaltungspflege.md`. Jede Operation mit Wirkung
      auf den Buchbestand erzeugt eine Änderung im Protokoll.
    - Meilenstein 4 (Tags lernmodell, vorlagen; GnuCash-Import unter import):
      fachliche Regeln in `gnucash.md`, `lernmodell.md` und `vorlagen.md`.
      Neue Felder bestehender Schemas sind optional (E-029).
    - Meilenstein 9 (Tag sicherung): fachliche Regeln in `sicherung.md`.
      Neue Änderungsquelle `sicherung` (`protokoll.md` 10).
    - Meilenstein 5 (Tags kredite, wiederkehrend, berichte, export):
      fachliche Regeln in `kredite.md`, `wiederkehrend.md` und
      `berichte.md`. Neues Objekt `kredit`, neue Änderungsquelle `kredit`
      (`protokoll.md` 11); neue Felder bestehender Schemas sind optional
      (E-029).
    - Meilenstein 6 (Tags geheimnisse, mail; Erweiterungen bei
      benachrichtigungen, sync, mock): fachliche Regeln in `fints.md`,
      `mail.md`, `benachrichtigungen.md` und `geheimnisse.md`. Neues Objekt
      `postfach` (`protokoll.md` 12); neue Felder bestehender Schemas sind
      optional, Aufzählungen nur erweitert (E-029). Geheimnisse erscheinen
      in keiner Antwort.
    - Meilenstein 7 (Tags anmeldung, betrieb): fachliche Regeln in
      `sicherheit.md` und `betrieb.md`. Bei eingeschalteter Anmeldung
      (`anmeldung = True`, Vorgabe aus, E-125) braucht jeder Pfad außer
      `GET /api/anmeldung`, `POST /api/anmeldung`,
      `POST /api/anmeldung/einrichten` und `GET /api/gesundheit` eine
      gültige Sitzung (Cookie `kontor_sitzung`), schreibende Methoden
      zusätzlich den Kopf `X-Kontor-CSRF`. Die Antworten 401, 403, 413 und
      429 in `x-allgemeine-antworten` sind für jede Operation zulässig
      (E-127); wann sie auftreten, legt `sicherheit.md` fest. Jede Antwort
      trägt die Sicherheitsköpfe aus `sicherheit.md` 6.
    - Meilenstein 8 (Oberfläche, `oberflaeche.md`): keine neuen fachlichen
      Endpunkte; einzige Ergänzung ist `POST /api/benachrichtigungen/test`
      (Test-Benachrichtigung aus den Einstellungen, `benachrichtigungen.md`
      8, E-138) mit dem Fehlercode `kein_benachrichtigungs_plugin`.
    - Meilenstein 10 (AqBanking-Plugin) ist mit Meilenstein 29 entfallen;
      `PluginInfo.name` kennt `aqbanking` nicht mehr (E-259).
    - Meilenstein 12 (Bearbeiten und Massenänderungen, `datenmodell.md`
      17): neuer Endpunkt `POST /api/buchungen/mehrfach/aendern` mit
      freien Statusänderungen; bestehende Schemas unverändert (E-173).
    - Meilenstein 13 (Versionsnummer und About-Fenster, `version.md`):
      neuer Endpunkt `GET /api/version` (Schema `Versionsangaben`, geschützt
      wie alle Endpunkte außer `sicherheit.md` 3.1); bestehende Schemas
      unverändert (E-178).
    - Meilenstein 15 (Sammelpaket Bedienung, `protokoll.md` 6.2a,
      `datenmodell.md` 18, `synchronisation.md` 20): neue Endpunkte
      `POST /api/buchungen/mehrfach/loeschen`,
      `POST /api/buchungen/mehrfach/verschieben` und
      `GET /api/konten/{konto_id}/herkunft`; `Rueckgaengig.bis_id`;
      Aufzählungen nur erweitert, neue Felder optional (E-189).
    - Meilenstein 23 (Schutz der Geheimnisse, gemerkte PIN, App-Passwort,
      `geheimnisschutz.md`): neue Endpunkte unter `/api/geheimnisse/schutz`,
      `/api/geheimnisse/entsperren`, `/api/geheimnisse/sperren`,
      `/api/sync/pin/gemerkt` und `/api/mail/postfaecher/{id}/app-passwort`;
      Schemas `GeheimnisSchutz`, `SchutzPasswort`, `AppPasswortEingabe`,
      `AppPasswortErgebnis`; bestehende Schemas unverändert (E-232).
    - Meilenstein 24 (Mail-Abgleich mit Serien, `erwartungen.md` 13):
      `GET /api/erwartungen` mit `grund=serie` und `serien=ja|nein`;
      `ErwartungListe.eintraege` als `oneOf` [`Erwartung`, `ErwartungSerie`];
      `ErwartungGrund` der gespeicherten Erwartungen unverändert (E-237).
    - Meilenstein 25 (Betragsfilter wiederkehrender Buchungen,
      `wiederkehrend.md` 9): `GET /api/wiederkehrend/einstellungen`,
      `PUT /api/wiederkehrend/einstellungen/vorgabe`,
      `PUT`/`DELETE /api/empfaenger/{id}/wiederkehrend`; Begründung mit
      optionalen Feldern `empfaenger`, `betragsfilter`, `betragsfilter_text`,
      Rolle `anderer_betrag` und Bruchgrund `betrag`; Protokollform des
      Empfängers mit optionalem Feld `wiederkehrend` (E-242).
    - Meilenstein 29 (Bankabruf über FinTS/camt, Bankzugang,
      `bankzugang.md`): Tag `bank` mit `GET`/`PUT /api/bank/zugang`,
      `POST /api/bank/zugang/tan-verfahren`,
      `POST /api/bank/zugang/konten/abrufen`, `PUT /api/bank/zugang/konten`,
      `GET`/`PUT /api/bank/zugang/diagnose`; Fehlercodes
      `bankzugang_nicht_aenderbar`, `bankzugang_unvollstaendig`, `tan_offen`
      (E-262).
    - Meilenstein 30 (Tags ausdruck, regeln, buchungen, export; `ausdruecke.md`,
      `kategorisierung.md` 8): Kontor-Ausdrücke (`GET /api/ausdruck/sprache`,
      `POST /api/ausdruck/pruefen`, `POST /api/ausdruck/als-regel`), Parameter
      `filter` und `stichtag` an der Buchungsliste und am Export, Feld
      `markierungen` der Buchung, Regeln mit `ausdruck`, `ausdruck_form`,
      `tag_ids` und `kategorie_id` null, `POST /api/regeln/reihenfolge`,
      `/test`, `/erklaeren`, `POST /api/regeln/{regel_id}/anwenden`, Feld
      `tags` in `RegelAnwendung`; Fehlercodes `ausdruck_ungueltig`,
      `regel_ohne_aktion` (E-270).
    - Meilenstein 31 (übrige Features vor sammel3; `lernmodell.md` 8–10,
      `berichte.md` 6, `erwartungen.md` 14, `version.md` 6, `betrieb.md` 9):
      `GET /api/buchungen/{buchung_id}/lernmodell`,
      `GET /api/lernmodell/uebersicht`, `GET`/`PUT /api/lernmodell/einstellungen`,
      `POST /api/mock/lerndaten`, `GET /api/berichte/monat` und neun weitere
      Berichte; `LernZustand.schwelle_promille` 500–990; Regeln mit
      `automatisch`/`empfaenger_id`, Empfänger mit `lernregel_gesperrt`,
      Mail-Einträge mit `angehaengt`; Fehlercode `bestand_nicht_leer` (E-278).
    - Meilenstein 32 (Sammelbranch sammel3, `sammel3.md`; nicht
      rückwärtskompatibel, E-293, E-294): `GET /api/statistik` entfällt;
      `standardkategorie_id` ist immer null (anderer Wert → 422
      `kategorie_ungueltig`); `GET /api/empfaenger/anzahlen`,
      `GET /api/empfaenger/{empfaenger_id}/konten`,
      `POST /api/mail/nachrichten/{nachricht_id}/buchung`,
      `GET /api/dokumente/{dokument_id}/mail/bilder`, `GET /api/konfiguration`;
      Parameter `suche` und `gruppieren` der Mail-Liste, `bilder` der
      Mail-Ansicht; `MailNachrichtEintrag.gruppe`, `MailAngehaengt.betrag`;
      Erwartungen mit `wiederholung` und Anbietern aus Beschreibungen;
      Fehlercodes `konto_existiert`, `wiederholung_nur_geplant`,
      `wiederholung_fehlt`.
servers:
  - url: /
tags:
  - name: status
  - name: konten
  - name: buchungen
  - name: tags
  - name: empfaenger
  - name: import
  - name: dubletten
  - name: sync
  - name: tan
  - name: benachrichtigungen
  - name: mock
  - name: regeln
  - name: aenderungen
  - name: umbuchungen
  - name: abstimmungen
  - name: suche
  - name: lernmodell
  - name: vorlagen
  - name: sicherung
  - name: kredite
  - name: wiederkehrend
  - name: berichte
  - name: export
  - name: geheimnisse
  - name: mail
  - name: anmeldung
  - name: betrieb
  - name: dokumente
  - name: erwartungen
  - name: bank
  - name: ausdruck

x-allgemeine-antworten:
  "401": {$ref: "#/components/responses/NichtAngemeldet"}
  "403": {$ref: "#/components/responses/Verboten"}
  "413": {$ref: "#/components/responses/ZuGross"}
  "429": {$ref: "#/components/responses/Gesperrt"}

paths:
  /api/status:
    get:
      tags: [status]
      operationId: statusLesen
      summary: Betriebsmodus, Plugins und Mock-Hinweis
      responses:
        "200":
          description: Status
          headers:
            X-Kontor-Modus: {$ref: "#/components/headers/XKontorModus"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}

  /api/konten:
    get:
      tags: [konten]
      operationId: kontenListe
      summary: Alle Konten (inkl. Kategorien), nach id aufsteigend
      parameters:
        - name: art
          in: query
          description: Nur diese Kontoarten (mehrfach angebbar, ODER-verknüpft)
          schema:
            type: array
            items: {$ref: "#/components/schemas/Kontoart"}
          style: form
          explode: true
        - name: geschlossen
          in: query
          description: true = nur geschlossene, false = nur offene, fehlt = alle
          schema: {type: boolean}
      responses:
        "200":
          description: Kontenliste
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Konto"}
        "422": {$ref: "#/components/responses/Validierung"}
    post:
      tags: [konten]
      operationId: kontoAnlegen
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KontoNeu"}
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Konto"}
        "409":
          description: "`iban_existiert`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: "`validierung`, `iban_ungueltig`, `hierarchie_ungueltig` (Elternkonto andere Klasse), `referenz_unbekannt` (Elternkonto fehlt)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/konten/{konto_id}:
    parameters:
      - {$ref: "#/components/parameters/KontoId"}
    get:
      tags: [konten]
      operationId: kontoLesen
      responses:
        "200":
          description: Konto
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Konto"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
    patch:
      tags: [konten]
      operationId: kontoAendern
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KontoAenderung"}
      responses:
        "200":
          description: Geändert
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Konto"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`iban_existiert`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: "`validierung`, `iban_ungueltig`, `hierarchie_ungueltig` (andere Klasse oder Zyklus), `referenz_unbekannt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
    delete:
      tags: [konten]
      operationId: kontoLoeschen
      responses:
        "204": {description: Gelöscht}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`konto_in_verwendung` (Splits oder Unterkonten vorhanden; ab M2 Regelbezug; ab M3 Standardkategorie eines Empfängers oder Abstimmung)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/konten/{konto_id}/loeschen:
    parameters:
      - {$ref: "#/components/parameters/KontoId"}
    post:
      tags: [konten]
      operationId: kontoLoeschenMitBuchungen
      summary: Benutztes Konto oder Kategorie löschen, mit Wahl des Umgangs mit den Buchungen (loeschen.md)
      description: |
        Prüfreihenfolge: 422 `validierung`, 404, 422 `kein_elternkonto` bzw.
        `ziel_ungueltig`, 409 `buchung_gesperrt`. Atomar, eine Änderung
        `konto_loeschen_mit_buchungen`. Mit `trocken = true` wird nur das
        Ergebnis berechnet (nie 409, keine Änderung).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KontoLoeschen"}
      responses:
        "200":
          description: Ergebnis (bei `trocken` ohne Änderung)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KontoLoeschErgebnis"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`buchung_gesperrt` mit `details.buchung_ids` (gesperrte Buchungen ohne `gesperrte_einbeziehen`)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: "`validierung`, `kein_elternkonto` (Variante elternkonto bei Wurzelkonto), `ziel_ungueltig` (Unkategorisiert nach Unkategorisiert)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/konten/{konto_id}/herkunft:
    parameters:
      - {$ref: "#/components/parameters/KontoId"}
    get:
      tags: [konten]
      operationId: kontoHerkunft
      summary: "M15: Importe und Synchronisationsläufe mit noch vorhandenen Buchungen auf diesem Konto (datenmodell.md 18.3)"
      responses:
        "200":
          description: Nach zeitpunkt absteigend
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Herkunft"}
        "404": {$ref: "#/components/responses/NichtGefunden"}

  /api/kategorien:
    get:
      tags: [konten]
      operationId: kategorienListe
      summary: Alle Konten der Arten aufwand und ertrag, nach id aufsteigend
      responses:
        "200":
          description: Kategorien
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Konto"}

  /api/kontenuebersicht:
    get:
      tags: [konten]
      operationId: kontenuebersicht
      summary: Finanzübersicht – alle Konten mit Saldo
      parameters:
        - name: stichtag
          in: query
          description: Nur Buchungen mit datum ≤ stichtag; fehlt = alle Buchungen
          schema: {type: string, format: date}
      responses:
        "200":
          description: Übersicht
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Kontenuebersicht"}
        "422": {$ref: "#/components/responses/Validierung"}

  /api/buchungen:
    get:
      tags: [buchungen]
      operationId: buchungenListe
      summary: Buchungsliste mit Filtern, Sortierung und Paginierung
      description: |
        Alle Filter sind UND-verknüpft. Filter mit nicht existierender ID
        liefern eine leere Liste (kein Fehler). Sortierung ist stabil: bei
        Gleichstand entscheidet `id` aufsteigend.
      parameters:
        - name: konto_id
          in: query
          description: Nur Buchungen mit mindestens einem Split auf diesem Konto (ohne Unterkonten). Setzt außerdem die Bedeutung von `betrag` (datenmodell.md 3.3).
          schema: {type: integer}
        - name: unterkonten
          in: query
          description: "M11 (datenmodell.md 16.1): mit konto_id auch dessen Unterkonten (Treffer und betrag); ohne konto_id ohne Wirkung"
          schema: {type: boolean, default: false}
        - name: von
          in: query
          description: datum ≥ von
          schema: {type: string, format: date}
        - name: bis
          in: query
          description: datum ≤ bis. von > bis → 422.
          schema: {type: string, format: date}
        - name: betrag_min
          in: query
          description: betrag ≥ betrag_min (Cent, Betrag gemäß datenmodell.md 3.3)
          schema: {type: integer}
        - name: betrag_max
          in: query
          description: betrag ≤ betrag_max. betrag_min > betrag_max → 422.
          schema: {type: integer}
        - name: kategorie_id
          in: query
          description: Nur Buchungen mit mindestens einem Split auf diesem Konto (beliebige Art; mit `unterkategorien=true` auch auf dessen Unterkonten)
          schema: {type: integer}
        - name: unterkategorien
          in: query
          schema: {type: boolean, default: false}
        - name: tag_id
          in: query
          description: Nur Buchungen, die alle angegebenen Tags tragen (mehrfach angebbar, UND-verknüpft)
          schema:
            type: array
            items: {type: integer}
          style: form
          explode: true
        - name: empfaenger_id
          in: query
          schema: {type: integer}
        - name: ohne_empfaenger
          in: query
          description: true = nur Buchungen ohne Empfänger
          schema: {type: boolean, default: false}
        - name: verwendungszweck
          in: query
          description: norm(verwendungszweck) enthält norm(Wert) (datenmodell.md 1)
          schema: {type: string, minLength: 1}
        - name: zweck_gleich
          in: query
          description: "M27 (sammel.md 3): norm(verwendungszweck) = norm(Wert)"
          schema: {type: string, minLength: 1}
        - name: zweck_leer
          in: query
          description: "M27 (sammel.md 3): true = nur Verwendungszweck exakt leer; Vorrang vor zweck_gleich"
          schema: {type: boolean}
        - name: zweck_aehnlich
          in: query
          description: "M27 (sammel.md 3): ein Wort des Werts als Teilzeichenkette von norm(verwendungszweck)"
          schema: {type: string, minLength: 1}
        - name: empfaenger_aehnlich
          in: query
          description: "M27 (sammel.md 3): Empfängername oder Alias mit gemeinsamem ekey-Anfang ≥ 4 Zeichen"
          schema: {type: string, minLength: 1}
        - name: filter
          in: query
          description: "M30 (ausdruecke.md 5): Kontor-Ausdruck im Kontext filter, UND-verknüpft mit den übrigen Parametern; ungültig → 422 ausdruck_ungueltig"
          schema: {type: string, minLength: 1, maxLength: 4000}
        - name: stichtag
          in: query
          description: "M30 (ausdruecke.md 2.4): Bezugstag relativer Datumsangaben in filter; Vorgabe heute nach der Uhr der App"
          schema: {type: string, format: date}
        - name: verdacht
          in: query
          description: "M27 (sammel.md 1.1): ja = Feld `verdacht` an den Buchungen bilden; Vorgabe nein (Antwort unverändert)"
          schema: {type: string, enum: [ja, nein], default: nein}
        - name: position_id
          in: query
          description: "D-271: Buchungs-ID; die Antwort trägt dann zusätzlich `position` (Stelle ab 0 in der gefilterten, sortierten Liste oder null). Ohne den Parameter fehlt das Feld."
          schema: {type: integer, minimum: 1}
        - name: suche
          in: query
          description: Freitext. Treffer, wenn norm(Wert) in norm(x) enthalten ist für mindestens ein x aus Empfängername, Verwendungszweck, Split-Memos, Tag-Namen der Buchung.
          schema: {type: string, minLength: 1}
        - name: status
          in: query
          description: Nur diese Status (mehrfach angebbar, ODER-verknüpft)
          schema:
            type: array
            items: {$ref: "#/components/schemas/Buchungsstatus"}
          style: form
          explode: true
        - name: vorschlag
          in: query
          description: "M2: true = nur Buchungen mit offenem Vorschlag, false = nur ohne (kategorisierung.md 5)"
          schema: {type: boolean}
        - name: abgestimmt
          in: query
          description: "M3: true = nur abgestimmte Buchungen, false = nur nicht abgestimmte (buchhaltungspflege.md 5.5)"
          schema: {type: boolean}
        - name: sortierung
          in: query
          description: |
            `datum`/`-datum`: nach datum; `betrag`/`-betrag`: nach `betrag`;
            `empfaenger`/`-empfaenger`: nach norm(Empfängername), Buchungen
            ohne Empfänger stehen bei aufsteigender wie absteigender Sortierung
            am Ende. Gleichstand: id aufsteigend.
          schema:
            type: string
            enum: [datum, -datum, betrag, -betrag, empfaenger, -empfaenger]
            default: datum
        - name: seite
          in: query
          description: 1-basiert. Seiten jenseits des Endes liefern leere `eintraege`.
          schema: {type: integer, minimum: 1, default: 1}
        - name: pro_seite
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 50}
      responses:
        "200":
          description: Seite der Buchungsliste
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Buchungsseite"}
        "422": {$ref: "#/components/responses/Validierung"}
    post:
      tags: [buchungen]
      operationId: buchungAnlegen
      summary: Manuelle Buchung anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BuchungNeu"}
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Buchung"}
        "422":
          description: "`validierung`, `zu_wenige_splits`, `buchung_unausgeglichen`, `referenz_unbekannt` (Konto, Empfänger, Tag)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/buchungen/{buchung_id}:
    parameters:
      - {$ref: "#/components/parameters/BuchungId"}
    get:
      tags: [buchungen]
      operationId: buchungLesen
      parameters:
        - name: verdacht
          in: query
          description: "M27 (sammel.md 1.1): ja = Feld `verdacht` an den Buchungen bilden; Vorgabe nein (Antwort unverändert)"
          schema: {type: string, enum: [ja, nein], default: nein}
      responses:
        "200":
          description: Buchung
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Buchung"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "422": {$ref: "#/components/responses/Validierung"}
    patch:
      tags: [buchungen]
      operationId: buchungAendern
      description: |
        Prüfreihenfolge: 422 (Anfrage), 409 `buchung_gesperrt` (Buchung ist
        abgeglichen und es werden andere Felder als `tag_ids`/`status`
        geändert), 409 `status_uebergang_unzulaessig`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BuchungAenderung"}
      responses:
        "200":
          description: Geändert
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Buchung"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`buchung_gesperrt`, `status_uebergang_unzulaessig`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: "`validierung`, `referenz_unbekannt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
    delete:
      tags: [buchungen]
      operationId: buchungLoeschen
      responses:
        "204": {description: Gelöscht}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`buchung_gesperrt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/buchungen/{buchung_id}/splits:
    parameters:
      - {$ref: "#/components/parameters/BuchungId"}
    put:
      tags: [buchungen]
      operationId: splitsErsetzen
      summary: Alle Splits einer Buchung ersetzen (splitten, zusammenführen)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SplitsErsetzen"}
      responses:
        "200":
          description: Buchung mit neuen Splits
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Buchung"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`buchung_gesperrt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: "`validierung`, `zu_wenige_splits`, `buchung_unausgeglichen`, `referenz_unbekannt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/buchungen/{buchung_id}/kategorie:
    parameters:
      - {$ref: "#/components/parameters/BuchungId"}
    put:
      tags: [buchungen]
      operationId: kategorieSetzen
      summary: Kategorie einer Buchung setzen (datenmodell.md 3.2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kategorie_id]
              properties:
                kategorie_id: {type: integer}
      responses:
        "200":
          description: Geändert
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Buchung"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`buchung_gesperrt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: "`validierung`, `kategorie_ungueltig` (fehlt oder keine Art aufwand/ertrag), `nicht_kategorisierbar`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/buchungen/mehrfach/kategorie:
    post:
      tags: [buchungen]
      operationId: mehrfachKategorie
      summary: Mehrfachbearbeitung – Kategorie für mehrere Buchungen setzen
      description: |
        Atomar: Entweder werden alle genannten Buchungen geändert oder keine.
        Prüfreihenfolge: 422 `validierung` (Anfrage, z. B. doppelte IDs),
        422 `referenz_unbekannt` (unbekannte Buchungs-IDs; `details.buchung_ids`),
        422 `kategorie_ungueltig`, 409 `buchung_gesperrt`
        (`details.buchung_ids`), 422 `nicht_kategorisierbar`
        (`details.buchung_ids`). Nicht genannte Buchungen bleiben unverändert.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MehrfachKategorie"}
      responses:
        "200":
          description: Geändert
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MehrfachErgebnis"}
        "409":
          description: "`buchung_gesperrt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: "`validierung`, `referenz_unbekannt`, `kategorie_ungueltig`, `nicht_kategorisierbar`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/buchungen/mehrfach/tags:
    post:
      tags: [buchungen]
      operationId: mehrfachTags
      summary: Mehrfachbearbeitung – Tags hinzufügen und/oder entfernen
      description: |
        Atomar. Erst werden `entfernen`, dann `hinzufuegen` angewendet. Tags,
        die eine Buchung schon trägt, werden nicht doppelt zugeordnet;
        Entfernen eines nicht zugeordneten Tags ist kein Fehler. Unbekannte
        Buchungs- oder Tag-IDs → 422 `referenz_unbekannt`. Erlaubt auch bei
        abgeglichenen Buchungen.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MehrfachTags"}
      responses:
        "200":
          description: Geändert
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MehrfachErgebnis"}
        "422":
          description: "`validierung`, `referenz_unbekannt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/buchungen/mehrfach/aendern:
    post:
      tags: [buchungen]
      operationId: mehrfachAendern
      summary: Status, Datum, Empfänger und Verwendungszweck einer oder mehrerer Buchungen setzen (M12)
      description: |
        Fachliche Regeln in `datenmodell.md` 17.2. Atomar. Freie
        Statusübergänge; das Verlassen von `abgeglichen` verlangt
        `entsperren: true`. Prüfreihenfolge: 422 `validierung`, 422
        `referenz_unbekannt` (unbekannte Buchungen mit
        `details.buchung_ids`, danach unbekanntes `empfaenger_id`), 409
        `buchung_gesperrt` (`details.buchung_ids`), 409
        `bestaetigung_erforderlich` (`details.buchung_ids`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MehrfachAenderung"}
      responses:
        "200":
          description: Geändert
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MehrfachErgebnis"}
        "409":
          description: "`buchung_gesperrt`, `bestaetigung_erforderlich`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: "`validierung`, `referenz_unbekannt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/buchungen/mehrfach/loeschen:
    post:
      tags: [buchungen]
      operationId: mehrfachLoeschen
      summary: "M15: Mehrere Buchungen in einer Änderung löschen (datenmodell.md 18.1)"
      description: |
        Atomar. Prüfreihenfolge: 422 `validierung`, 422
        `referenz_unbekannt` (`details.buchung_ids`), 409 `buchung_gesperrt`
        (`details.buchung_ids`). Wirkung je Buchung wie
        `DELETE /api/buchungen/{id}`; eine Änderung `mehrfach_loeschen`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MehrfachLoeschen"}
      responses:
        "200":
          description: Gelöscht
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MehrfachLoeschErgebnis"}
        "409":
          description: "`buchung_gesperrt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: "`validierung`, `referenz_unbekannt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/buchungen/mehrfach/verschieben:
    post:
      tags: [buchungen]
      operationId: mehrfachVerschieben
      summary: "M15: Buchungen von einem Bestandskonto auf ein anderes verschieben (datenmodell.md 18.2)"
      description: |
        Genau eines von `buchung_ids` und `gruppe`. Prüfreihenfolge: 422
        `validierung`, Quell- dann Zielkonto 422 `referenz_unbekannt` bzw.
        `konto_ungueltig` (`details.feld`), 422 `referenz_unbekannt`
        (`details.buchung_ids` bzw. unbekannte Gruppe), 422
        `verschieben_unmoeglich` (`details.buchung_ids`), 409
        `buchung_gesperrt` (`details.buchung_ids`). Atomar; eine Änderung
        `mehrfach_verschieben`, wenn sich etwas ändert.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MehrfachVerschieben"}
      responses:
        "200":
          description: Verschoben (auch leer)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MehrfachVerschiebeErgebnis"}
        "409":
          description: "`buchung_gesperrt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: "`validierung`, `referenz_unbekannt`, `konto_ungueltig`, `verschieben_unmoeglich`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/tags:
    get:
      tags: [tags]
      operationId: tagsListe
      summary: Alle Tags, nach id aufsteigend
      responses:
        "200":
