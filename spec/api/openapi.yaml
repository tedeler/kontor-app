  # ---------------------------------------------------------------- M18 Dokumente (dokumente.md)
  /api/dokumente:
    post:
      tags: [dokumente]
      operationId: dokumentAnhaengen
      summary: Datei an Buchungen anhängen (dokumente.md 2.1)
      description: |
        Prüfreihenfolge dokumente.md 2.1: 413 datei_zu_gross (Upload-Pfad), 422 validierung (Query,
        multipart, Feld datei, kein buchung_id mit Ort body.buchung_ids), 404 nicht_gefunden (Buchung),
        422 dokument_leer, 422 dokument_typ_unbekannt. Änderung dokument_anhaengen.
      parameters:
        - name: buchung_id
          in: query
          required: false
          description: wiederholbar, mindestens einmal (sonst 422); Doppelte zählen einmal
          schema:
            type: array
            items: {type: integer}
          style: form
          explode: true
        - name: quelle
          in: query
          required: false
          schema: {type: string, enum: [upload, kamera, mail], default: upload}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datei]
              properties:
                datei:
                  type: string
                  format: binary
                  description: Dateiname des Teils = Vorschlag für dateiname (dokumente.md 1.3)
      responses:
        "201":
          description: Dokument angelegt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dokument"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "422":
          description: "`validierung`, `dokument_leer`, `dokument_typ_unbekannt`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/dokumente/aus-mail:
    post:
      tags: [dokumente]
      operationId: dokumentAusMail
      summary: Gespiegelte E-Mail als Dokument anhängen (dokumente.md 2.2)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DokumentAusMail"}
      responses:
        "201":
          description: Dokument (quelle mail, message/rfc822)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dokument"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "422": {$ref: "#/components/responses/Validierung"}

  /api/dokumente/{dokument_id}:
    parameters:
      - {$ref: "#/components/parameters/DokumentId"}
    get:
      tags: [dokumente]
      operationId: dokumentLesen
      responses:
        "200":
          description: Dokument
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dokument"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
    patch:
      tags: [dokumente]
      operationId: dokumentUmbenennen
      summary: Umbenennen (dokumente.md 2.4)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DokumentAenderung"}
      responses:
        "200":
          description: Dokument
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dokument"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "422": {$ref: "#/components/responses/Validierung"}
    delete:
      tags: [dokumente]
      operationId: dokumentLoeschen
      summary: Dokument samt Verknüpfungen entfernen (dokumente.md 2.5)
      responses:
        "204": {description: entfernt}
        "404": {$ref: "#/components/responses/NichtGefunden"}

  /api/dokumente/{dokument_id}/buchungen:
    parameters:
      - {$ref: "#/components/parameters/DokumentId"}
    post:
      tags: [dokumente]
      operationId: dokumentVerknuepfen
      summary: Mit weiteren Buchungen verknüpfen (dokumente.md 2.6)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DokumentBuchungen"}
      responses:
        "200":
          description: Dokument
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dokument"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "422": {$ref: "#/components/responses/Validierung"}

  /api/dokumente/{dokument_id}/buchungen/{buchung_id}:
    parameters:
      - {$ref: "#/components/parameters/DokumentId"}
      - {$ref: "#/components/parameters/BuchungId"}
    delete:
      tags: [dokumente]
      operationId: dokumentLoesen
      summary: Von einer Buchung lösen (dokumente.md 2.7)
      responses:
        "200":
          description: verbleibende Buchungen
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DokumentGeloest"}
        "404": {$ref: "#/components/responses/NichtGefunden"}

  /api/buchungen/{buchung_id}/dokumente:
    parameters:
      - {$ref: "#/components/parameters/BuchungId"}
    get:
      tags: [dokumente]
      operationId: buchungDokumente
      summary: Dokumente einer Buchung (dokumente.md 2.8)
      responses:
        "200":
          description: Dokumente nach id aufsteigend
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DokumentListe"}
        "404": {$ref: "#/components/responses/NichtGefunden"}

  /api/dokumente/{dokument_id}/inhalt:
    parameters:
      - {$ref: "#/components/parameters/DokumentId"}
    get:
      tags: [dokumente]
      operationId: dokumentInhalt
      summary: Gespeicherte Bytes (dokumente.md 2.9, Köpfe 2.12)
      parameters:
        - name: herunterladen
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Content-Type = mime_typ; E-Mails immer application/octet-stream als Anhang
          content:
            application/pdf:
              schema: {type: string, format: binary}
            image/*:
              schema: {type: string, format: binary}
            application/octet-stream:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "422": {$ref: "#/components/responses/Validierung"}

  /api/dokumente/{dokument_id}/mail:
    parameters:
      - {$ref: "#/components/parameters/DokumentId"}
    get:
      tags: [dokumente]
      operationId: dokumentMail
      summary: E-Mail zerlegt (dokumente.md 2.10)
      responses:
        "200":
          description: Mailansicht
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailAnsicht"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`keine_mail`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/dokumente/{dokument_id}/mail/html:
    parameters:
      - {$ref: "#/components/parameters/DokumentId"}
    get:
      tags: [dokumente]
      operationId: dokumentMailHtml
      summary: Entschärftes HTML der Mail (dokumente.md 2.11)
      parameters:
        - name: bilder
          in: query
          description: "M32 (sammel3.md 8.5): ja = Bildadressen fremder Server bleiben stehen, img-src data: https: http:"
          schema: {type: string, enum: [ja, nein], default: nein}
      responses:
        "200":
          description: vollständiges HTML-Dokument, text/html; charset=utf-8
          content:
            text/html:
              schema: {type: string}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "422": {$ref: "#/components/responses/Validierung"}
        "409":
          description: "`keine_mail`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/dokumente/{dokument_id}/mail/bilder:
    parameters:
      - {$ref: "#/components/parameters/DokumentId"}
    get:
      tags: [dokumente]
      operationId: dokumentMailBilder
      summary: "M32 (sammel3.md 8.5): Zahl der Bildadressen fremder Server"
      responses:
        "200":
          description: Anzahl
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailBilder"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`keine_mail`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/dokumente/{dokument_id}/mail/anhaenge/{nr}:
    parameters:
      - {$ref: "#/components/parameters/DokumentId"}
      - name: nr
        in: path
        required: true
        schema: {type: integer}
    get:
      tags: [dokumente]
      operationId: dokumentMailAnhang
      summary: Anhang einer Mail (dokumente.md 2.13)
      parameters:
        - name: herunterladen
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: dekodierte Bytes des Teils
          content:
            application/pdf:
              schema: {type: string, format: binary}
            image/*:
              schema: {type: string, format: binary}
            text/plain:
              schema: {type: string}
            application/octet-stream:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`keine_mail`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422": {$ref: "#/components/responses/Validierung"}

  # ---------------------------------------------------------------- M19 ALF-BanCo, Kategorien zusammenführen
  /api/import/alfbanco:
    post:
      tags: [import]
      operationId: importAlfbanco
      summary: QIF-Export aus ALF-BanCo in ein Bestandskonto importieren (alfbanco.md 2)
      description: |
        Prüfreihenfolge alfbanco.md 2: 413 datei_zu_gross (Upload-Pfad), 422 validierung (Formular,
        konto_id mit Ort body.konto_id, datei mit Ort body.datei), 422 referenz_unbekannt bzw.
        konto_ungueltig mit details.feld = "konto_id" (vor dem Lesen der Datei), dann Dateifehler wie
        bei den anderen Importen (fehler.details = ImportErgebnis).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datei, konto_id]
              properties:
                datei: {type: string, format: binary}
                konto_id:
                  type: string
                  pattern: "^\\s*[1-9][0-9]{0,17}\\s*$"
      responses:
        "200":
          description: Import erfolgreich (`format = "qif"`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportErgebnis"}
        "422":
          description: "`validierung`, `referenz_unbekannt`, `konto_ungueltig`, Dateifehler (`import_*`)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/kategorien/zusammenfuehren:
    post:
      tags: [konten]
      operationId: kategorienZusammenfuehren
      summary: Mehrere Kategorien auf eine Zielkategorie umbuchen (alfbanco.md 5)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KategorienZusammenfuehren"}
      responses:
        "200":
          description: Ergebnis (auch im Probelauf)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ZusammenfuehrenErgebnis"}
        "409":
          description: "`konto_in_verwendung` (details.kredit_ids), `buchung_gesperrt` (details.buchung_ids)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: "`validierung`, `ziel_ungueltig`, `referenz_unbekannt` und `konto_ungueltig` (details.konto_ids)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  # ---------------------------------------------------------------- M20 Erwartete Zahlungen (erwartungen.md)
  /api/erwartungen:
    get:
      tags: [erwartungen]
      operationId: erwartungenListe
      summary: Erwartete Zahlungen mit Filtern (erwartungen.md 6.1; Serien ab M24, erwartungen.md 13)
      parameters:
        - name: grund
          in: query
          description: ab M24 zusätzlich `serie` (Serien wiederkehrender Buchungen, erwartungen.md 13.1)
          schema: {type: array, items: {$ref: "#/components/schemas/ErwartungGrundAbfrage"}}
          style: form
          explode: true
        - name: serien
          in: query
          description: "ab M24: `ja` liefert ohne `grund` zusätzlich die Serien (erwartungen.md 13.1); Vorgabe `nein`"
          schema: {type: string, enum: [ja, nein], default: nein}
        - name: zustand
          in: query
          description: ohne Angabe nur offen; ueberfaellig = offen mit frist < heute; mehrere ODER-verknüpft
          schema:
            type: array
            items: {type: string, enum: [offen, erfuellt, guthaben, storniert, erledigt, ueberfaellig]}
          style: form
          explode: true
        - name: faellig_bis
          in: query
          schema: {type: string, format: date}
        - name: suche
          in: query
          schema: {type: string}
        - name: richtung
          in: query
          schema: {type: string, enum: [ausgabe, eingang]}
      responses:
        "200":
          description: Liste nach frist, id
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErwartungListe"}
        "422": {$ref: "#/components/responses/Validierung"}
    post:
      tags: [erwartungen]
      operationId: erwartungAnlegen
      summary: Manuelle Erwartung anlegen (erwartungen.md 6.2)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ErwartungNeu"}
      responses:
        "201":
          description: angelegt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErwartungDetail"}
        "422": {$ref: "#/components/responses/Validierung"}

  /api/erwartungen/abgleich:
    post:
      tags: [erwartungen]
      operationId: erwartungenAbgleich
      summary: Abgleich auslösen (erwartungen.md 4)
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: false, maxProperties: 0}
      responses:
        "200":
          description: Zählungen; bei einem internen Fehler `{}` (erwartungen.md 9)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AbgleichErgebnis"}
        "409":
          description: "`mail_abgleich_aus`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/erwartungen/{erwartung_id}:
    parameters:
      - {$ref: "#/components/parameters/ErwartungId"}
    get:
      tags: [erwartungen]
      operationId: erwartungLesen
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErwartungDetail"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
    patch:
      tags: [erwartungen]
      operationId: erwartungAendern
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ErwartungAenderung"}
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErwartungDetail"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "422":
          description: "`validierung`, `zuordnung_zu_hoch`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
    delete:
      tags: [erwartungen]
      operationId: erwartungLoeschen
      responses:
        "204": {description: gelöscht}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`erwartung_aus_mail`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/erwartungen/{erwartung_id}/zustand:
    parameters:
      - {$ref: "#/components/parameters/ErwartungId"}
    post:
      tags: [erwartungen]
      operationId: erwartungZustand
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ErwartungZustandWechsel"}
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErwartungDetail"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`zustand_unzulaessig`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422": {$ref: "#/components/responses/Validierung"}

  /api/erwartungen/{erwartung_id}/kandidaten:
    parameters:
      - {$ref: "#/components/parameters/ErwartungId"}
    get:
      tags: [erwartungen]
      operationId: erwartungKandidaten
      responses:
        "200":
          description: Kandidaten in der Reihenfolge erwartungen.md 5.1
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KandidatListe"}
        "404": {$ref: "#/components/responses/NichtGefunden"}

  /api/erwartungen/{erwartung_id}/buchungen:
    parameters:
      - {$ref: "#/components/parameters/ErwartungId"}
    post:
      tags: [erwartungen]
      operationId: erwartungZuordnen
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ErwartungBuchungen"}
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErwartungDetail"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`erwartung_nicht_offen`, `buchung_bereits_zugeordnet`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
          description: "`validierung`, `zuordnung_ungueltig`, `zuordnung_zu_hoch`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/erwartungen/{erwartung_id}/buchungen/{buchung_id}:
    parameters:
      - {$ref: "#/components/parameters/ErwartungId"}
      - {$ref: "#/components/parameters/BuchungId"}
    delete:
      tags: [erwartungen]
      operationId: erwartungLoesen
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErwartungDetail"}
        "404": {$ref: "#/components/responses/NichtGefunden"}

components:
  headers:
    XKontorModus:
      description: Betriebsmodus
      schema:
        type: string
        enum: [mock, echt]

  parameters:
    KontoId:
      name: konto_id
      in: path
      required: true
      schema: {type: integer}
    BuchungId:
      name: buchung_id
      in: path
      required: true
      schema: {type: integer}
    TagId:
      name: tag_id
      in: path
      required: true
      schema: {type: integer}
    TanId:
      name: tan_id
      in: path
      required: true
      schema: {type: integer}
    AenderungId:
      name: aenderung_id
      in: path
      required: true
      schema: {type: integer}
    KreditId:
      name: kredit_id
      in: path
      required: true
      schema: {type: integer}
    ErwartungId:
      name: erwartung_id
      in: path
      required: true
      schema: {type: integer}
    DokumentId:
      name: dokument_id
      in: path
      required: true
      schema: {type: integer}
    PostfachId:
      name: postfach_id
      in: path
      required: true
      schema: {type: integer}
    BerichtVon:
      name: von
      in: query
      description: "Beginn (einschließlich); Vorgabe: kleinstes Buchungsdatum, höchstens bis"
      schema: {type: string, format: date}
    BerichtBis:
      name: bis
      in: query
      description: "Ende (einschließlich); Vorgabe: heute (App-Uhr); von > bis → 422"
      schema: {type: string, format: date}
    BerichtIntervall:
      name: intervall
      in: query
      schema:
        type: string
        enum: [tag, woche, monat, jahr]
        default: monat
    BerichtSonderposten:
      name: sonderposten
      in: query
      description: D-300 – `ohne` lässt Buchungen mit dem Tag „Sonderposten“ aus, `mit` zählt sie mit
      schema:
        type: string
        enum: [ohne, mit]
        default: ohne

  responses:
    NichtAngemeldet:
      description: "`nicht_angemeldet`; bei der Anmeldung `anmeldung_fehlgeschlagen` (sicherheit.md 3.2, 4.2)"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Fehler"}
    Verboten:
      description: "`csrf_ungueltig`, `netz_nicht_erlaubt`, `anmeldung_fehlgeschlagen`, `einrichtungscode_ungueltig` (sicherheit.md 4.6, 4.8, 5, 10)"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Fehler"}
    ZuGross:
      description: "`datei_zu_gross`, `anfrage_zu_gross` (sicherheit.md 8)"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Fehler"}
    Gesperrt:
      description: "`anmeldung_gesperrt`; Kopf `Retry-After` (sicherheit.md 4.5)"
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Fehler"}
    NichtGefunden:
      description: "`nicht_gefunden`"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Fehler"}
    Validierung:
      description: "`validierung`"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Fehler"}

  schemas:
    Id:
      type: integer
      minimum: 1

    Betrag:
      type: integer
      minimum: -999999999999
      maximum: 999999999999
      description: Ganze Cent

    Datum:
      type: string
      format: date
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

    Zeitstempel:
      type: string
      format: date-time
      pattern: "Z$"

    Fehler:
      type: object
      additionalProperties: false
      required: [fehler]
      properties:
        fehler:
          type: object
          additionalProperties: false
          required: [code, meldung, details]
          properties:
            code:
              type: string
              description: |
                Bekannte Codes: validierung, nicht_gefunden,
                methode_nicht_erlaubt, konflikt, referenz_unbekannt,
                zu_wenige_splits, buchung_unausgeglichen,
                status_uebergang_unzulaessig, buchung_gesperrt,
                kategorie_ungueltig, nicht_kategorisierbar, iban_ungueltig,
                iban_existiert, hierarchie_ungueltig, konto_in_verwendung,
                tag_existiert, empfaenger_existiert, import_datei_leer,
                import_format_ungueltig, import_datei_beschaedigt,
                import_inhalt_ungueltig, interner_fehler.
                Ab M2 zusätzlich: kein_vorschlag, sync_laeuft,
                tan_ausstehend, tan_abgelaufen, tan_nicht_offen,
                tan_ungueltig, nur_mock_modus.
                Ab M3 zusätzlich: alias_existiert, empfaenger_in_verwendung,
                konto_ungueltig, keine_umbuchung, abstimmung_nicht_letzte,
                bereits_rueckgaengig, rueckgaengig_konflikt, kein_elternkonto,
                ziel_ungueltig.
                Ab M4 keine neuen Codes.
                Ab M9 zusätzlich: sicherung_ungueltig, sicherung_modus,
                bestaetigung_erforderlich.
                Ab M5 zusätzlich: kredit_konto_belegt, kredit_rate_zu_klein,
                kredit_jahr_abgeglichen, bericht_zu_gross.
                Ab M6 zusätzlich: pin_quelle_systemd,
                geheimnis_schluessel_ungueltig, postfach_existiert,
                nur_echtmodus, oauth_client_fehlt, oauth_zustand_ungueltig,
                oauth_abgelehnt, oauth_scope_fehlt, oauth_kein_refresh_token,
                oauth_fehler, mail_abruf_laeuft.
                Ab M7 zusätzlich: nicht_angemeldet, anmeldung_fehlgeschlagen,
                anmeldung_gesperrt, anmeldung_abgeschaltet,
                nicht_eingerichtet, bereits_eingerichtet,
                einrichtungscode_ungueltig, csrf_ungueltig,
                netz_nicht_erlaubt, datei_zu_gross, anfrage_zu_gross,
                nicht_bereit (sicherheit.md 11, betrieb.md 6).
                Ab M8 zusätzlich: kein_benachrichtigungs_plugin
                (benachrichtigungen.md 8).
                Ab M12 keine neuen Codes (`bestaetigung_erforderlich`
                auch bei `POST /api/buchungen/mehrfach/aendern`).
                Ab M15 zusätzlich: verschieben_unmoeglich
                (`datenmodell.md` 18.2).
                Ab M18 zusätzlich: dokument_leer, dokument_typ_unbekannt,
                keine_mail (`dokumente.md` 2.14).
                Ab M19 keine neuen Codes (`alfbanco.md`).
                Ab M20 zusätzlich: mail_abgleich_aus, erwartung_aus_mail,
                zustand_unzulaessig, erwartung_nicht_offen,
                zuordnung_ungueltig, buchung_bereits_zugeordnet,
                zuordnung_zu_hoch (`erwartungen.md` 6).
                Ab M23 zusätzlich: geheimnisse_gesperrt,
                schutz_bereits_aktiv, schutz_nicht_aktiv, huelle_unlesbar
                (`geheimnisschutz.md` 2, 5, 6); bei
                `PUT /api/mail/postfaecher/{id}/app-passwort` außerdem die
                Mailfehler-Codes mail_anmeldung_abgelehnt, mail_fehler,
                mail_ordner_unbekannt, mail_verbindung als 422.
                Ab M30 zusätzlich: ausdruck_ungueltig (`details.fehler`,
                `ausdruecke.md` 4.2), regel_ohne_aktion (`kategorisierung.md` 8.2).
                Ab M31 zusätzlich: bestand_nicht_leer (`POST /api/mock/lerndaten`,
                `lernmodell.md` 10).
                Ab M32 zusätzlich: konto_existiert (409, `details.konto_ids`,
                `sammel3.md` 1.2), wiederholung_nur_geplant,
                wiederholung_fehlt (422, `sammel3.md` 14.1).
                Ab M29 zusätzlich: bankzugang_nicht_aenderbar,
                bankzugang_unvollstaendig, tan_offen (`bankzugang.md` 4);
                die Endpunkte unter `/api/bank/zugang` liefern außerdem die
                Codes der Bank-Plugin-Fehler (bank_pin_fehlt,
                bank_pin_falsch, bank_zugang_gesperrt, bank_verbindung,
                bank_zeitueberschreitung, bank_fehler,
                plugin_nicht_verfuegbar) als 409. Entfallen:
                bank_tan_nicht_unterstuetzt (M10).
                Unbekannte Pfade → 404 nicht_gefunden; unzulässige Methode →
                405 methode_nicht_erlaubt.
            meldung:
              type: string
              minLength: 1
              description: Deutscher Text für Menschen
            details:
              description: Zusätzliche Angaben oder null. Bei `validierung` eine Liste von Objekten mit `ort` (Liste aus Zeichenketten/Zahlen) und `meldung`.

    Status:
      type: object
      additionalProperties: false
      required: [version, modus, mock, hinweis, plugins, mock_szenario]
      properties:
        version:
          type: string
          minLength: 1
          description: kontor.__version__; ab M13 im Schema von version.md 1.1 (geprüft über Versionsangaben)
        modus:
          type: string
          enum: [mock, echt]
        mock: {type: boolean}
        hinweis:
          type: [string, "null"]
          description: Im Mock-Modus nicht leer und enthält „Mock“; im Echtmodus null
        mock_szenario:
          type: [string, "null"]
          description: Im Mock-Modus das Szenario, sonst null
        plugins:
          type: object
          additionalProperties: false
          required: [bank, mail]
          properties:
            bank: {$ref: "#/components/schemas/PluginInfo"}
            mail: {$ref: "#/components/schemas/PluginInfo"}

    PluginInfo:
      type: object
      additionalProperties: false
      required: [name, mock]
      properties:
        name: {type: string, enum: [mock, fints, imap]}
        mock: {type: boolean}

    Kontoart:
      type: string
      enum: [girokonto, sparkonto, kreditkonto, aufwand, ertrag, eigenkapital]

    Konto:
      type: object
      additionalProperties: false
      required: [id, name, art, eltern_id, iban, waehrung, geschlossen, eroeffnet_am, notiz, extern_id, ist_kategorie]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string, minLength: 1}
        art: {$ref: "#/components/schemas/Kontoart"}
        eltern_id:
          oneOf:
            - {$ref: "#/components/schemas/Id"}
            - {type: "null"}
        iban:
          type: [string, "null"]
          pattern: "^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$"
        waehrung: {type: string, const: EUR}
        geschlossen: {type: boolean}
        eroeffnet_am:
          oneOf:
            - {$ref: "#/components/schemas/Datum"}
            - {type: "null"}
        notiz: {type: string}
        extern_id: {type: [string, "null"]}
        ist_kategorie: {type: boolean}

    KontoNeu:
      type: object
      additionalProperties: false
      required: [name, art]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        art: {$ref: "#/components/schemas/Kontoart"}
        eltern_id: {type: [integer, "null"]}
        iban: {type: [string, "null"], description: "Leerzeichen erlaubt; wird normalisiert"}
        geschlossen: {type: boolean, default: false}
        eroeffnet_am:
          oneOf:
            - {$ref: "#/components/schemas/Datum"}
            - {type: "null"}
        notiz: {type: string, maxLength: 10000, default: ""}

    KontoAenderung:
      type: object
      additionalProperties: false
      description: Nur angegebene Felder werden geändert. `art` ist nicht änderbar.
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        eltern_id: {type: [integer, "null"]}
        iban: {type: [string, "null"]}
        geschlossen: {type: boolean}
        eroeffnet_am:
          oneOf:
            - {$ref: "#/components/schemas/Datum"}
            - {type: "null"}
        notiz: {type: string, maxLength: 10000}

    KontoSaldo:
      type: object
      additionalProperties: false
      required: [konto_id, name, art, eltern_id, geschlossen, saldo, saldo_gesamt, anzahl_buchungen]
      properties:
        konto_id: {$ref: "#/components/schemas/Id"}
        name: {type: string}
        art: {$ref: "#/components/schemas/Kontoart"}
        eltern_id:
          oneOf:
            - {$ref: "#/components/schemas/Id"}
            - {type: "null"}
        geschlossen: {type: boolean}
        saldo:
          type: integer
          description: Summe der eigenen Splits (bis Stichtag)
        saldo_gesamt:
          type: integer
          description: saldo plus saldo aller Unterkonten (rekursiv)
        anzahl_buchungen:
          type: integer
          minimum: 0
          description: Anzahl verschiedener Buchungen mit Split auf diesem Konto (bis Stichtag)

    Kontenuebersicht:
      type: object
      additionalProperties: false
      required: [stichtag, konten, summe_bestand, summe_gesamt]
      properties:
        stichtag:
          oneOf:
            - {$ref: "#/components/schemas/Datum"}
            - {type: "null"}
        konten:
          type: array
          description: Alle Konten (auch Kategorien und geschlossene), nach konto_id aufsteigend
          items: {$ref: "#/components/schemas/KontoSaldo"}
        summe_bestand:
          type: integer
          description: Summe saldo aller Bestandskonten (girokonto, sparkonto, kreditkonto)
        summe_gesamt:
          type: integer
          description: Summe saldo aller Konten; immer 0

    Buchungsstatus:
      type: string
      enum: [importiert, vorlaeufig, bestaetigt, abgeglichen]

    Split:
      type: object
      additionalProperties: false
      required: [id, konto_id, betrag, memo]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        konto_id: {$ref: "#/components/schemas/Id"}
        betrag: {$ref: "#/components/schemas/Betrag"}
        memo: {type: string}
        abstimmung_id:
          description: "M3 (buchhaltungspflege.md 1.2); ab M3 immer vorhanden, im Schema optional (E-029)"
          oneOf:
            - {$ref: "#/components/schemas/Id"}
            - {type: "null"}

    SplitNeu:
      type: object
      additionalProperties: false
      required: [konto_id, betrag]
      properties:
        konto_id: {type: integer}
        betrag: {$ref: "#/components/schemas/Betrag"}
        memo: {type: string, maxLength: 10000, default: ""}

    TagKurz:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string}

    EmpfaengerKurz:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string}

    Beleg:
      type: object
      description: Ab M18 ein an der Buchung hängendes Dokument (dokumente.md 1.4); bis M17 nie vorhanden.
      additionalProperties: false
      required: [id, dateiname, mime_typ, groesse]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        dateiname: {type: string}
        mime_typ: {type: string}
        groesse: {type: integer, minimum: 0}

    Buchung:
      type: object
      additionalProperties: false
      required: [id, datum, empfaenger, verwendungszweck, status, splits, tags, kategorie_id, betrag, extern_ids, belege]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        datum: {$ref: "#/components/schemas/Datum"}
        empfaenger:
          oneOf:
            - {$ref: "#/components/schemas/EmpfaengerKurz"}
            - {type: "null"}
        verwendungszweck: {type: string}
        status: {$ref: "#/components/schemas/Buchungsstatus"}
        splits:
          type: array
          minItems: 2
          items: {$ref: "#/components/schemas/Split"}
        tags:
          type: array
          items: {$ref: "#/components/schemas/TagKurz"}
        kategorie_id:
          oneOf:
            - {$ref: "#/components/schemas/Id"}
            - {type: "null"}
        betrag:
          type: integer
          description: datenmodell.md 3.3
        extern_ids:
          type: array
          items: {type: string}
        belege:
          type: array
          description: "Bis M17 immer leer; ab M18 die verknüpften Dokumente nach id aufsteigend (dokumente.md 1.4, E-210)"
          items: {$ref: "#/components/schemas/Beleg"}
        vorschlag:
          description: |
            M2 (kategorisierung.md 5). Ab M2 in jeder Buchungsantwort
            vorhanden; im Schema optional, damit Antworten nach M1 gültig
            bleiben (E-029).
          oneOf:
            - {$ref: "#/components/schemas/Vorschlag"}
            - {type: "null"}
        gegen_iban:
          description: "M3 (buchhaltungspflege.md 1.1); ab M3 immer vorhanden, im Schema optional (E-029)"
          type: [string, "null"]
          pattern: "^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$"
        ist_umbuchung:
          description: "M3, abgeleitet (buchhaltungspflege.md 1.1)"
          type: boolean
        abgestimmt:
          description: "M3, abgeleitet (buchhaltungspflege.md 1.1)"
          type: boolean
        verdacht:
          description: "M27 (sammel.md 1): nur mit verdacht=ja an GET /api/buchungen, /api/buchungen/{id}, /api/suche; fehlt sonst und bei bestätigten Buchungen"
          $ref: "#/components/schemas/BuchungVerdacht"
        markierungen:
          description: "M30 (ausdruecke.md 5): nur an GET /api/buchungen mit Parameter filter; Textstellen, die eine Bedingung erfüllt haben"
          type: array
          items: {$ref: "#/components/schemas/Markierung"}

    Markierung:
      type: object
      additionalProperties: false
      required: [feld, start, ende]
      properties:
        feld: {type: string, minLength: 1}
        start: {type: integer, minimum: 0}
        ende: {type: integer, minimum: 0}

    BuchungVerdacht:
      type: object
      additionalProperties: false
      required: [grund, text]
      properties:
        grund: {type: string, enum: [empfaenger, betrag]}
        text: {type: string, minLength: 1}

    BuchungNeu:
      type: object
      additionalProperties: false
      required: [datum, splits]
      properties:
        datum: {$ref: "#/components/schemas/Datum"}
        empfaenger_id: {type: [integer, "null"]}
        verwendungszweck: {type: string, maxLength: 10000, default: ""}
        status:
          type: string
          enum: [importiert, vorlaeufig, bestaetigt]
          default: bestaetigt
        splits:
          type: array
          description: Mindestens 2 (sonst 422 zu_wenige_splits), Summe 0 (sonst 422 buchung_unausgeglichen)
          items: {$ref: "#/components/schemas/SplitNeu"}
        tag_ids:
          type: array
          items: {type: integer}
          default: []

    BuchungAenderung:
      type: object
      additionalProperties: false
      description: Nur angegebene Felder werden geändert. `tag_ids` ersetzt die Tag-Menge.
      properties:
        datum: {$ref: "#/components/schemas/Datum"}
        empfaenger_id: {type: [integer, "null"]}
        verwendungszweck: {type: string, maxLength: 10000}
        status: {$ref: "#/components/schemas/Buchungsstatus"}
        tag_ids:
          type: array
          items: {type: integer}

    SplitsErsetzen:
      type: object
      additionalProperties: false
      required: [splits]
      properties:
        splits:
          type: array
          items: {$ref: "#/components/schemas/SplitNeu"}

    Buchungsseite:
      type: object
      additionalProperties: false
      required: [eintraege, gesamt, seite, pro_seite, summe]
      properties:
        eintraege:
          type: array
          items: {$ref: "#/components/schemas/Buchung"}
        gesamt:
          type: integer
          minimum: 0
          description: Anzahl aller Treffer (alle Seiten)
        seite: {type: integer, minimum: 1}
        pro_seite: {type: integer, minimum: 1, maximum: 500}
        summe:
          type: integer
          description: Summe von `betrag` über alle Treffer (alle Seiten)

    MehrfachKategorie:
      type: object
      additionalProperties: false
      required: [buchung_ids, kategorie_id]
      properties:
        buchung_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: integer}
        kategorie_id: {type: integer}

    MehrfachTags:
      type: object
      additionalProperties: false
      required: [buchung_ids]
      properties:
        buchung_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: integer}
        hinzufuegen:
          type: array
          items: {type: integer}
          default: []
        entfernen:
          type: array
          items: {type: integer}
          default: []

    MehrfachAenderung:
      type: object
      additionalProperties: false
      description: |
        M12 (`datenmodell.md` 17.2). Mindestens eines der Felder `status`,
        `datum`, `empfaenger_id`, `verwendungszweck` (sonst 422
        `validierung`).
      required: [buchung_ids]
      anyOf:
        - required: [status]
        - required: [datum]
        - required: [empfaenger_id]
        - required: [verwendungszweck]
      properties:
        buchung_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: integer}
        status: {$ref: "#/components/schemas/Buchungsstatus"}
        datum: {$ref: "#/components/schemas/Datum"}
        empfaenger_id: {type: [integer, "null"]}
        verwendungszweck: {type: string, maxLength: 10000}
        entsperren: {type: boolean, default: false}

    MehrfachErgebnis:
      type: object
      additionalProperties: false
      required: [geaendert, anzahl]
      properties:
        geaendert:
          type: array
          description: Alle genannten Buchungs-IDs, aufsteigend
          items: {$ref: "#/components/schemas/Id"}
        anzahl: {type: integer, minimum: 0}

    MehrfachLoeschen:
      type: object
      additionalProperties: false
      description: M15 (`datenmodell.md` 18.1)
      required: [buchung_ids]
      properties:
        buchung_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: integer}

    MehrfachLoeschErgebnis:
      type: object
      additionalProperties: false
      required: [geloescht, anzahl]
      properties:
        geloescht:
          type: array
          description: Alle genannten Buchungs-IDs, aufsteigend
          items: {$ref: "#/components/schemas/Id"}
        anzahl: {type: integer, minimum: 1}

    MehrfachVerschieben:
      type: object
      additionalProperties: false
      description: |
        M15 (`datenmodell.md` 18.2). Genau eines von `buchung_ids` und
        `gruppe`; `von_konto_id` ≠ `nach_konto_id` (sonst 422 `validierung`).
      required: [von_konto_id, nach_konto_id]
      oneOf:
        - required: [buchung_ids]
        - required: [gruppe]
      properties:
        von_konto_id: {type: integer}
        nach_konto_id: {type: integer}
        buchung_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: integer}
        gruppe: {type: string, minLength: 1}

    MehrfachVerschiebeErgebnis:
      type: object
      additionalProperties: false
      required: [verschoben, anzahl]
      properties:
        verschoben:
          type: array
          description: IDs der verschobenen Buchungen, aufsteigend (leer bei leerer Auswahl)
          items: {$ref: "#/components/schemas/Id"}
        anzahl: {type: integer, minimum: 0}

    Herkunft:
      type: object
      additionalProperties: false
      description: M15 (`datenmodell.md` 18.3)
      required: [gruppe, art, beschreibung, zeitpunkt, anzahl]
      properties:
        gruppe: {type: string, pattern: "^(import|sync):[1-9][0-9]*$"}
        art: {type: string, enum: [import, sync]}
        beschreibung: {type: string, minLength: 1}
        zeitpunkt:
          oneOf:
            - {$ref: "#/components/schemas/Zeitstempel"}
            - {type: "null"}
        anzahl: {type: integer, minimum: 1}

    Tag:
      type: object
      additionalProperties: false
      required: [id, name, extern_id, anzahl_buchungen]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string, minLength: 1}
        extern_id: {type: [string, "null"]}
        anzahl_buchungen: {type: integer, minimum: 0}

    TagEingabe:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}

    Empfaenger:
      type: object
      additionalProperties: false
      required: [id, name, extern_id]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string, minLength: 1}
        extern_id: {type: [string, "null"]}
        aliase:
          description: "M3 (buchhaltungspflege.md 2.1); ab M3 immer vorhanden, im Schema optional (E-029)"
          type: array
          items: {type: string, minLength: 1}
        standardkategorie_id:
          description: "M3 (buchhaltungspflege.md 2.5); ab M3 immer vorhanden, im Schema optional (E-029); ab M32 in Antworten immer null (sammel3.md 2.1), ältere Protokolleinträge können eine ID tragen"
          oneOf:
            - {$ref: "#/components/schemas/Id"}
            - {type: "null"}
        tags:
          description: "M27 (sammel.md 2): Tags des Empfängers nach (name, id); fehlt ohne Tags"
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/TagKurz"}
        lernregel_gesperrt:
          description: "M31 (lernmodell.md 9.4): nur bei gesperrten Empfängern, dann `true`; seit D-305 nur noch aus früheren Beständen, ohne Wirkung"
          const: true

    EmpfaengerNeu:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        aliase:
          description: M3
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 200}
          default: []
        standardkategorie_id:
          description: M3
          type: [integer, "null"]
          default: null

    EmpfaengerAenderung:
      type: object
      additionalProperties: false
      description: "M3: nur angegebene Felder werden geändert; `aliase` ersetzt die Liste"
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        aliase:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 200}
        standardkategorie_id: {type: [integer, "null"]}
        tag_ids:
          description: "M27 (sammel.md 2): ersetzt die Tags des Empfängers; [] entfernt alle"
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: integer}

    EmpfaengerZusammenfuehren:
      type: object
      additionalProperties: false
      required: [quelle_ids]
      properties:
        quelle_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: integer}
        name:
          type: string
          description: "M11 (buchhaltungspflege.md 10): neuer Name des Ziels; nach strip() 1–200 Zeichen"

    ImportMeldung:
      type: object
      additionalProperties: false
      required: [code, meldung, referenz]
      properties:
        code: {type: string}
        meldung: {type: string, minLength: 1}
        referenz: {type: [string, "null"]}

    ImportErgebnis:
      type: object
      additionalProperties: false
      required:
        - erfolgreich
        - format
        - konten_neu
        - konten_vorhanden
        - kategorien_neu
        - kategorien_vorhanden
        - empfaenger_neu
        - empfaenger_vorhanden
        - tags_neu
        - tags_vorhanden
        - buchungen_neu
        - buchungen_vorhanden
        - buchungen_zusammengefuehrt
        - buchungen_zur_pruefung
        - buchungen_uebersprungen
        - splits_neu
        - warnungen
        - fehler
        - import_id
      properties:
        erfolgreich: {type: boolean}
        format:
          type: [string, "null"]
          enum: [kmy-gzip, kmy-xml, gnc-xml-gzip, gnc-xml, gnc-sqlite, qif, null]
          description: "gnc-* ab M4 (gnucash.md 2), qif ab M19 (alfbanco.md 2.1)"
        konten_neu: {type: integer, minimum: 0}
        konten_vorhanden: {type: integer, minimum: 0}
        kategorien_neu: {type: integer, minimum: 0}
        kategorien_vorhanden: {type: integer, minimum: 0}
        empfaenger_neu: {type: integer, minimum: 0}
        empfaenger_vorhanden: {type: integer, minimum: 0}
        tags_neu: {type: integer, minimum: 0}
        tags_vorhanden: {type: integer, minimum: 0}
        buchungen_neu: {type: integer, minimum: 0}
        buchungen_vorhanden: {type: integer, minimum: 0}
        buchungen_zusammengefuehrt: {type: integer, minimum: 0}
        buchungen_zur_pruefung: {type: integer, minimum: 0}
        buchungen_uebersprungen: {type: integer, minimum: 0}
        splits_neu: {type: integer, minimum: 0}
        warnungen:
          type: array
          items: {$ref: "#/components/schemas/ImportMeldung"}
        fehler:
          type: array
          items: {$ref: "#/components/schemas/ImportMeldung"}
        import_id:
          oneOf:
            - {$ref: "#/components/schemas/Id"}
            - {type: "null"}

    Importvorgang:
      type: object
      additionalProperties: false
      required: [id, art, dateiname, sha256, importiert_am, ergebnis]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        art: {type: string, enum: [kmymoney, gnucash, alfbanco], description: "gnucash ab M4, alfbanco ab M19"}
        dateiname: {type: [string, "null"]}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        importiert_am: {$ref: "#/components/schemas/Zeitstempel"}
        ergebnis: {$ref: "#/components/schemas/ImportErgebnis"}

    Verdachtsstatus:
      type: string
      enum: [offen, zusammengefuehrt, keine_dublette]

    Dublettenverdacht:
      type: object
      additionalProperties: false
      required: [id, buchung_id, kandidat_ids, grund, status, erstellt_am]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        buchung_id: {$ref: "#/components/schemas/Id"}
        kandidat_ids:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Id"}
        grund: {type: string, enum: [mehrdeutig, aehnlich]}
        status: {$ref: "#/components/schemas/Verdachtsstatus"}
        erstellt_am: {$ref: "#/components/schemas/Zeitstempel"}

    DubletteNeu:
      type: object
      additionalProperties: false
      required: [buchung_ids]
      properties:
        buchung_ids:
          type: array
          minItems: 2
          maxItems: 50
          uniqueItems: true
          items: {type: integer}

    DublettenVorschlag:
      type: object
      additionalProperties: false
      description: "M27 (sammel.md 4.2): abgeleiteter, nicht gespeicherter Vorschlag"
      required: [vorschlag, id, buchung_id, kandidat_ids, grund, status, erstellt_am]
      properties:
        vorschlag: {const: true}
        id: {type: "null"}
        buchung_id: {$ref: "#/components/schemas/Id"}
        kandidat_ids:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Id"}
        grund: {const: gleich}
        status: {const: offen}
        erstellt_am: {type: "null"}

    DubletteAufloesen:
      type: object
      additionalProperties: false
      required: [entscheidung]
      properties:
        entscheidung:
          type: string
          enum: [zusammenfuehren, keine_dublette]
        behalten_id:
          type: integer
          description: Pflicht bei zusammenfuehren; muss in kandidat_ids liegen

    # ---------------------------------------------------------------- M2
    Vorschlag:
      type: object
      additionalProperties: false
      required: [kategorie_id, regel_id, quelle, vorher_konto_id]
      properties:
        kategorie_id: {$ref: "#/components/schemas/Id"}
        regel_id:
          oneOf:
            - {$ref: "#/components/schemas/Id"}
            - {type: "null"}
        quelle:
          type: string
          enum: [regel, standardkategorie, lernmodell]
          description: "`standardkategorie` ab M3 (buchhaltungspflege.md 2.5), `lernmodell` ab M4 (lernmodell.md 5.1); bei beiden regel_id = null"
        vorher_konto_id: {$ref: "#/components/schemas/Id"}
        sicherheit:
          type: integer
          minimum: 0
          maximum: 1000
          description: "Ab M4, nur bei quelle = lernmodell (dort Pflicht): Sicherheit in Promille (lernmodell.md 4)"

    VorschlagAktion:
      type: object
      additionalProperties: false
      required: [aktion]
      properties:
        aktion: {type: string, enum: [annehmen, ablehnen]}

    MehrfachVorschlag:
      type: object
      additionalProperties: false
      required: [buchung_ids, aktion]
      properties:
        buchung_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: integer}
        aktion: {type: string, enum: [annehmen, ablehnen]}

    BedingungText:
      type: object
      additionalProperties: false
      required: [feld, operator, wert]
      properties:
        feld: {type: string, enum: [empfaenger, verwendungszweck]}
        operator: {type: string, enum: [enthaelt, gleich, beginnt_mit]}
        wert: {type: string, minLength: 1, maxLength: 200, pattern: "\\S"}

    BedingungBetrag:
      type: object
      additionalProperties: false
      required: [feld, operator, wert]
      properties:
        feld: {type: string, const: betrag}
        operator: {type: string, enum: [gleich, mindestens, hoechstens]}
        wert: {$ref: "#/components/schemas/Betrag"}

    BedingungKonto:
      type: object
      additionalProperties: false
      required: [feld, operator, wert]
      properties:
        feld: {type: string, const: konto_id}
        operator: {type: string, const: gleich}
        wert: {type: integer}

    Bedingung:
      oneOf:
        - {$ref: "#/components/schemas/BedingungText"}
        - {$ref: "#/components/schemas/BedingungBetrag"}
        - {$ref: "#/components/schemas/BedingungKonto"}

    BedingungAusdruck:
      description: "M30 (kategorisierung.md 8.1): einziger Eintrag der Liste bei Regeln mit ausdruck_form = ausdruck; wert ist die strukturierte Form des Ausdrucks (Aufbau nicht festgelegt)"
      type: object
      additionalProperties: false
      required: [feld, operator, wert]
      properties:
        feld: {type: string, const: ausdruck}
        operator: {type: string, const: ausdruck}
        wert: {type: object}

    Regel:
      description: |
        Ab M30 (kategorisierung.md 8.1): REST-Antworten tragen immer `ausdruck`,
        `ausdruck_form` und `tag_ids` (im Schema optional, E-029); die
        Protokollform (protokoll.md 22) enthält `ausdruck` und `ausdruck_form`
        nie und `tag_ids` nur, wenn die Regel Tags hat. `kategorie_id` darf
        null sein.
      type: object
      additionalProperties: false
      required: [id, name, aktiv, prioritaet, kategorie_id, bedingungen]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string, minLength: 1}
        aktiv: {type: boolean}
        prioritaet: {type: integer, minimum: 0, maximum: 1000000}
        kategorie_id:
          oneOf:
            - {$ref: "#/components/schemas/Id"}
            - {type: "null"}
        bedingungen:
          type: array
          minItems: 1
          maxItems: 20
          items:
            oneOf:
              - {$ref: "#/components/schemas/Bedingung"}
              - {$ref: "#/components/schemas/BedingungAusdruck"}
        ausdruck:
          description: "M30: kanonischer Text der Bedingung; bei Regeln der bisherigen Form die gleichbedeutende Übersetzung"
          type: string
          minLength: 1
        ausdruck_form: {type: string, enum: [ausdruck, bedingungen]}
        tag_ids:
          description: "M30: Tags, die die Regel vergibt; aufsteigend"
          type: array
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/Id"}
        automatisch:
          description: "M31 (lernmodell.md 9.3): `true` nur bei automatisch angelegten Regeln; fehlt sonst (auch in der Protokollform)"
          type: boolean
        empfaenger_id:
          description: "M31: Empfänger, für den die automatische Regel angelegt wurde; nur bei automatischen Regeln"
          oneOf:
            - {$ref: "#/components/schemas/Id"}
            - {type: "null"}

    RegelNeu:
      description: |
        Ab M30: genau eines von `ausdruck` und `bedingungen`; `kategorie_id`
        (nicht null) oder mindestens ein Tag (kategorisierung.md 8.2).
      type: object
      additionalProperties: false
      required: [name]
      oneOf:
        - required: [ausdruck]
        - required: [bedingungen]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        aktiv: {type: boolean, default: true}
        prioritaet:
          type: integer
          minimum: 0
          maximum: 1000000
          description: "Vorgabe: größte vorhandene prioritaet + 10, ohne Regeln 100"
        kategorie_id: {type: [integer, "null"]}
        tag_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {type: integer}
        ausdruck: {type: string, minLength: 1, maxLength: 4000}
        bedingungen:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: "#/components/schemas/Bedingung"}

    RegelAenderung:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        aktiv: {type: boolean}
        prioritaet: {type: integer, minimum: 0, maximum: 1000000}
        kategorie_id: {type: [integer, "null"]}
        tag_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {type: integer}
        ausdruck: {type: string, minLength: 1, maxLength: 4000}
        bedingungen:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: "#/components/schemas/Bedingung"}

    RegelnAnwenden:
      type: object
      additionalProperties: false
      properties:
        buchung_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: integer}
        regel_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: integer}
        nur_unkategorisiert: {type: boolean, default: true}
        trocken: {type: boolean, default: false}

    RegelAnwendung:
      type: object
      additionalProperties: false
      required: [geprueft, anzahl, trocken, aenderungen]
      properties:
        geprueft: {type: integer, minimum: 0}
        anzahl: {type: integer, minimum: 0}
        trocken: {type: boolean}
        aenderungen:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [buchung_id, regel_id, kategorie_id]
            properties:
              buchung_id: {$ref: "#/components/schemas/Id"}
              regel_id: {$ref: "#/components/schemas/Id"}
              kategorie_id: {$ref: "#/components/schemas/Id"}
        tags:
          description: "M30 (kategorisierung.md 8.3): neu vergebene Tags je Buchung, nach buchung_id aufsteigend; fehlt, wenn keine Tags vergeben wurden"
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [buchung_id, tag_ids]
            properties:
              buchung_id: {$ref: "#/components/schemas/Id"}
              tag_ids:
                type: array
                minItems: 1
                uniqueItems: true
                items: {$ref: "#/components/schemas/Id"}

    RegelnReihenfolge:
      type: object
      additionalProperties: false
      required: [regel_ids]
      properties:
        regel_ids:
          type: array
          items: {type: integer}

    RegelTestAnfrage:
      description: "kategorisierung.md 8.6; ohne ausdruck und ohne regel_id 422 validierung"
      type: object
      additionalProperties: false
      properties:
        ausdruck: {type: string, maxLength: 4000}
        regel_id: {type: integer}
        kategorie_id: {type: [integer, "null"]}
        tag_ids:
          type: array
          items: {type: integer}
        testmenge: {type: string, maxLength: 4000, description: "Filter-Ausdruck; Vorgabe `datum in -12m`; leer = alle Buchungen"}
        konto_id: {type: integer}
        stichtag: {type: string, format: date}
        wirkung: {$ref: "#/components/schemas/RegelWirkung"}
        seite: {type: integer, minimum: 1, default: 1}
        pro_seite: {type: integer, minimum: 1, default: 100}

    RegelWirkung:
      type: string
      enum: [neu, abweichend, bereits_so, verdeckt, uebersprungen, treffer]

    RegelTestErgebnis:
      type: object
      additionalProperties: false
      required: [testmenge_anzahl, anzahl, zaehlung, tags_anzahl, gesperrt_anzahl, gesamt, seite, pro_seite, treffer,
                 nicht_erfasst]
      properties:
        testmenge_anzahl: {type: integer, minimum: 0}
        anzahl: {type: integer, minimum: 0}
        zaehlung:
          description: "Zahl der Treffer je Wirkung; Wirkungen ohne Treffer dürfen fehlen"
          type: object
          propertyNames: {$ref: "#/components/schemas/RegelWirkung"}
          additionalProperties: {type: integer, minimum: 0}
        tags_anzahl: {type: integer, minimum: 0}
        gesperrt_anzahl: {type: integer, minimum: 0}
        gesamt: {type: integer, minimum: 0}
        seite: {type: integer, minimum: 1}
        pro_seite: {type: integer, minimum: 1}
        treffer:
          type: array
          items: {$ref: "#/components/schemas/RegelTestTreffer"}
        nicht_erfasst:
          type: object
          additionalProperties: false
          required: [anzahl, buchung_ids]
          properties:
            anzahl: {type: integer, minimum: 0}
            buchung_ids:
              type: array
              items: {$ref: "#/components/schemas/Id"}

    RegelTestTreffer:
      description: |
        kategorisierung.md 8.6. Die Form von `empfaenger`, `kategorie_vorher`,
        `kategorie_nachher` und der Einträge von `tags_neu` (ID, Name oder
        Objekt mit `id`) legt die Definition nicht fest (E-272).
      type: object
      additionalProperties: false
      required: [buchung_id, datum, wirkung]
      properties:
        buchung_id: {$ref: "#/components/schemas/Id"}
        datum: {$ref: "#/components/schemas/Datum"}
        betrag: {type: integer}
        empfaenger: {}
        verwendungszweck: {type: string}
        konto_ids:
          type: array
          items: {$ref: "#/components/schemas/Id"}
        kategorie_vorher: {}
        kategorie_nachher: {}
        wirkung: {$ref: "#/components/schemas/RegelWirkung"}
        verdeckt_von:
          oneOf:
            - {type: "null"}
            - type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: {$ref: "#/components/schemas/Id"}
                name: {type: string}
        grund:
          oneOf:
            - {type: "null"}
            - {type: string, enum: [gesperrt, splitbuchung]}
        markierungen:
          type: array
          items: {$ref: "#/components/schemas/Markierung"}
        tags_neu: {type: array}

    RegelErklaerenAnfrage:
      type: object
      additionalProperties: false
      required: [buchung_id]
      properties:
        ausdruck: {type: string, maxLength: 4000}
        regel_id: {type: integer}
        buchung_id: {type: integer}
        stichtag: {type: string, format: date}

    RegelErklaerung:
      type: object
      additionalProperties: false
      required: [buchung_id, ergebnis, baum]
      properties:
        buchung_id: {$ref: "#/components/schemas/Id"}
        ergebnis:
          description: "Gesamtergebnis: Wahrheitswert oder `wahr`/`falsch` (Form nicht festgelegt, E-272)"
          oneOf:
            - {type: boolean}
            - {type: string, enum: [wahr, falsch]}
        baum: {$ref: "#/components/schemas/ErklaerKnoten"}

    ErklaerKnoten:
      type: object
      required: [text, art, ergebnis]
      properties:
        text: {type: string}
        art: {type: string, minLength: 1}
        ergebnis: {type: string, enum: [wahr, falsch, nicht_ausgewertet]}
        wert: {}
        kinder:
          type: array
          items: {$ref: "#/components/schemas/ErklaerKnoten"}

    RegelEinzelAnwenden:
      type: object
      additionalProperties: false
      properties:
        testmenge: {type: string, maxLength: 4000}
        konto_id: {type: integer}
        buchung_ids:
          type: array
          uniqueItems: true
          items: {type: integer}
        abweichende_ueberschreiben: {type: boolean, default: false}
        stichtag: {type: string, format: date}

    RegelEinzelAnwendung:
      type: object
      additionalProperties: false
