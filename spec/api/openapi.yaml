        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegelnAnwenden"}
      responses:
        "200":
          description: Ergebnis
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegelAnwendung"}
        "422":
          description: "`validierung`, `referenz_unbekannt` (`details.buchung_ids` bzw. `details.regel_ids`)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

