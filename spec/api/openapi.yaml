          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dublettenverdacht"}
        "404": {$ref: "#/components/responses/NichtGefunden"}
        "409":
          description: "`konflikt` (Verdacht nicht offen); ab M3 `buchung_gesperrt` (zu entfernende Buchung gesperrt)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}
        "422":
