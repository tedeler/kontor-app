  /api/benachrichtigungen/zustellung:
    get:
      tags: [benachrichtigungen]
      operationId: zustellungStatus
      summary: Stand der Zustellung per Plugin (benachrichtigungen.md 4.3, ab M6)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ZustellStatus"}

  /api/benachrichtigungen/zustellen:
    post:
      tags: [benachrichtigungen]
      operationId: zustellen
      summary: Alle ausstehenden Benachrichtigungen sofort zustellen (ab M6)
      responses:
        "200":
          description: Ergebnis
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ZustellErgebnis"}

  /api/benachrichtigungen/test:
    post:
      tags: [benachrichtigungen]
      operationId: testBenachrichtigung
      summary: Test-Benachrichtigung über das konfigurierte Plugin senden (ab M8, benachrichtigungen.md 8, E-138)
      description: |
        Ohne Anfragekörper. Sendet genau eine Test-Push-Nachricht (Plugin
        `ntfy`) bzw. bestätigt nur (Plugin `mock`). Erzeugt keine
        Benachrichtigung, keine Änderung im Protokoll, ändert weder
        `GET /api/benachrichtigungen/zustellung` noch
        `GET /api/mock/zustellungen`. Ein Fehlschlag des Plugins ist keine
        Fehlerantwort, sondern `zugestellt = false` mit `fehler`.
      responses:
        "200":
          description: Ergebnis des Sendeversuchs
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TestBenachrichtigung"}
        "409":
          description: "`kein_benachrichtigungs_plugin` (Plugin `keins`)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/mock/zustellungen:
    get:
      tags: [mock]
      operationId: mockZustellungen
      summary: Vom Mock-Benachrichtigungs-Plugin gesendete Push-Nachrichten (ab M6)
      responses:
        "200":
          description: In Zustellreihenfolge; leer bei anderem Plugin
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PushNachricht"}
        "409":
          description: "`nur_mock_modus`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

