          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fehler"}

  /api/regeln/pruefung:
    get:
      tags: [regeln]
      operationId: regelnPruefung
      summary: Aktive automatisch angelegte Regeln, deren Anlagebedingungen nicht mehr gelten (lernmodell.md 9.5, D-305)
      responses:
        "200":
          description: Nur lesend; Regeln ohne Befund fehlen
