        regeln_automatisch: {type: boolean}

    MockLerndaten:
      description: "M31 (lernmodell.md 10): Aufbau frei (E-281)"
      type: object
      additionalProperties: true

    MonatsBericht:
      description: |
        M31 (berichte.md 6.1). Die Pflichtfelder legt E-282 fest; weitere
        Felder (Kacheln, Vergleiche, Ausreißer, Größenklassen) sind erlaubt.
      type: object
      additionalProperties: true
      required: [monat, konto_ids, ausgaben, einnahmen, fest, variabel, umbuchungen]
      properties:
        monat: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}
