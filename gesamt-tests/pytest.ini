[pytest]
# Konfiguration der Gesamtsuite (siehe README.md und ../TESTUMBAU.md).
testpaths = tests
pythonpath = .
norecursedirs = _selbstpruefung .git fixtures __pycache__ .hypothesis .pytest_cache *.egg-info
addopts = -ra --strict-markers
markers =
    app: benötigt die installierte Anwendung (Paket kontor)
    kern: wird zusätzlich von der Selbstprüfung gegen die Wegwerf-Referenz ausgeführt
    langsam: importiert große Fixtures
    m1: Meilenstein 1 (automatisch für tests/app/*.py, E-041)
    m2: Meilenstein 2 (automatisch für tests/app/m2/, dazu M2-Generatortests)
    m3: Meilenstein 3 (automatisch für tests/app/m3/, dazu M3-Generatortests)
    m4: Meilenstein 4 (automatisch für tests/app/m4/, dazu M4-Generatortests)
    m5: Meilenstein 5 (automatisch für tests/app/m5/, dazu M5-Generatortests)
    m6: Meilenstein 6 (automatisch für tests/app/m6/ und tests/attrappen/, dazu M6-Generatortests)
    m7: Meilenstein 7 Sicherheit und Betrieb (automatisch für tests/app/m7/, dazu M7-Generatortests)
    leistung: Leistungstests mit dem großen Datensatz (leistung.md, getrennt ausführbar)
    m9: Meilenstein 9 Datensicherung (automatisch für tests/app/m9/)
    m8: Meilenstein 8 Oberfläche (automatisch für tests/app/m8/; Browsertests zusätzlich browser)
    m11: Meilenstein 11 Kontostand, Kategorien als Konten, Empfänger zusammenführen (automatisch für tests/app/m11/)
    m12: Meilenstein 12 Statusänderung, Bearbeiten, Massenänderungen, Filterleiste (automatisch für tests/app/m12/)
    m13: Meilenstein 13 Versionsnummer, GET /api/version, About-Fenster (automatisch für tests/app/m13/)
    m15: Meilenstein 15 Sammelpaket Bedienung: Rückgängig bis, Löschen/Verschieben, Bankkonten zuordnen, Oberfläche (automatisch für tests/app/m15/)
    m16: Meilenstein 16 Wiederkehrende Buchungen: robustere Kette und Begründung je Buchung (automatisch für tests/app/m16/)
    m17: Meilenstein 17 Tabs der Ansichten und Gehe zur Gegenbuchung, nur Oberfläche (automatisch für tests/app/m17/)
    m18: Meilenstein 18 Dokumente an Buchungen (automatisch für tests/app/m18/)
    m19: Meilenstein 19 ALF-BanCo-Import und Kategorien zusammenführen (automatisch für tests/app/m19/)
    m20: Meilenstein 20 Mail-Abgleich, erwartete Zahlungen (automatisch für tests/app/m20/)
    m21: Meilenstein 21 Berichte mit Einzelbuchungen, Zoom, Sprungziel mittig, nur Oberfläche (automatisch für tests/app/m21/)
    m22: Meilenstein 22 Spaltenbreiten und Markierung der Buchungsliste, nur Oberfläche (automatisch für tests/app/m22/)
    m23: Meilenstein 23 Schutz der Geheimnisse mit dem Login-Passwort, gemerkte PIN, Gmail mit App-Passwort (automatisch für tests/app/m23/)
    m24: Meilenstein 24 Mail-Abgleich mit Serien, Kachel, Kategorie bei Erstattungen (automatisch für tests/app/m24/)
    m25: Meilenstein 25 Betragsfilter für wiederkehrende Buchungen (automatisch für tests/app/m25/)
    m26: Meilenstein 26 Bedienung auf dem Handy (automatisch für tests/app/m26/)
    m27: Meilenstein 27 Verdacht, Dubletten, Filter, Empfänger-Tags, Mail-Liste, Statistik (automatisch für tests/app/m27/)
    m28: Meilenstein 28 Oberfläche aus feature/sammel, nur Oberfläche (automatisch für tests/app/m28/)
    m29: Meilenstein 29 Bankabruf über FinTS/camt, Bankzugang über REST und Oberfläche; ersetzt M10 (automatisch für tests/app/m29/)
    m30: Meilenstein 30 Kontor-Ausdrücke, Filter im Kontoblatt, Regeln mit Ausdruck und Tags, Regeleditor (automatisch für tests/app/m30/)
    m31: Meilenstein 31 Lernmodell-Transparenz, automatische Regeln, Berichte, Bestellnummer-Mails, Testinstanz, Branch, Einstellungen in Bereichen, Gruppierung (automatisch für tests/app/m31/)
    m32: Meilenstein 32 Sammelbranch sammel3 – Kontonamen, Empfänger, Statistik entfällt, Mail-Blatt, Anbieter-Beschreibungen, PayPal, Konfiguration, geplante Zahlungen, HTTPS, Oberfläche (automatisch für tests/app/m32/)
    browser: Playwright-Test mit Chromium (oberflaeche.md; übersprungen, wenn kein Browser startet)
filterwarnings =
    ignore::DeprecationWarning:httpx.*
