# CI von Kontor: Gesamttests und Release (D-105, TESTUMBAU.md).
#
# Jeder Push auf main (also jeder Merge eines Feature-Branches) lässt zuerst die Gesamttests laufen, in fünf
# parallelen Jobs (eigene Tests, Gesamtsuite in zwei Teilen, eigene Browsertests, Gesamtsuite mit Browser), jeder mit
# dem Ziel unter 5 Minuten. Nur wenn
# alle grün sind, folgt das Release: Minor wird um 1 erhöht (0.07 → 0.08). Major wird nur auf Anweisung erhöht: Workflow „Release“ von
# Hand starten und „major“ ankreuzen (0.08 → 1.00). Die CI committet die neue VERSION auf main, setzt den Tag
# vMAJOR.MINOR und legt ein GitHub-Release mit automatisch erzeugten Notizen sowie Wheel und Quellpaket an.
#
# Die Commits der CI selbst lösen keinen weiteren Lauf aus (Pushes mit GITHUB_TOKEN starten keine Workflows).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      major:
        description: "Major-Version erhöhen (Minor wird 00)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    name: Gesamttests (${{ matrix.teil }})
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        # Fünf parallele Jobs, jeder unter 5 Minuten (TESTUMBAU.md). Die Gesamtsuite ohne Browser ist in zwei
        # gleich große Teile geteilt, weil sie auf den Runnern sonst rund 6 Minuten braucht; die Browsertests sind
        # in eigene und Gesamtsuite geteilt (D-325, zusammen rund 6 Minuten).
        teil: [eigene, gesamt-1, gesamt-2, browser-eigene, browser-gesamt]
    steps:
      - name: Quellstand holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Abhängigkeiten installieren
        run: python -m pip install -e ".[test]"

      - name: Core-Tests (Zeitbudget 30 Sekunden)
        if: matrix.teil == 'eigene'
        run: python -m pytest -q -p no:cacheprovider tests/core

      - name: Eigene Tests ohne Browser
        if: matrix.teil == 'eigene'
        run: python -m pytest -q -p no:cacheprovider -n auto -m "not browser and not core" tests

      - name: Gesamtsuite ohne Browser, Teil 1 von 2
        if: matrix.teil == 'gesamt-1'
        working-directory: gesamt-tests
        run: python -m pytest -q -p no:cacheprovider -n auto -m "not browser" --teil 1/2

      - name: Gesamtsuite ohne Browser, Teil 2 von 2
        if: matrix.teil == 'gesamt-2'
        working-directory: gesamt-tests
        run: python -m pytest -q -p no:cacheprovider -n auto -m "not browser" --teil 2/2

      - name: Eigene Browsertests
        if: matrix.teil == 'browser-eigene'
        env:
          KONTOR_TESTS_BROWSER_PFLICHT: "1"
        run: python -m pytest -q -p no:cacheprovider -n auto -m browser tests

      - name: Gesamtsuite mit Browser
        if: matrix.teil == 'browser-gesamt'
        working-directory: gesamt-tests
        env:
          KONTOR_TESTS_BROWSER_PFLICHT: "1"
        run: python -m pytest -q -p no:cacheprovider -n auto -m browser

  release:
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Quellstand holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: python -m pip install -e . build

      - name: Version erhöhen
        id: version
        env:
          MAJOR: ${{ github.event_name == 'workflow_dispatch' && inputs.major }}
        run: |
          git pull --rebase origin main
          if [ "$MAJOR" = "true" ]; then
            neu=$(python -m kontor.release hochzaehlen --major src/kontor/VERSION)
          else
            neu=$(python -m kontor.release hochzaehlen src/kontor/VERSION)
          fi
          if git rev-parse -q --verify "refs/tags/v$neu" >/dev/null; then
            echo "::error::Tag v$neu gibt es schon"
            exit 1
          fi
          echo "neu=$neu" >> "$GITHUB_OUTPUT"
          echo "Neue Version: $neu"

      - name: Version committen und taggen
        env:
          NEU: ${{ steps.version.outputs.neu }}
        run: |
          git config user.name "Kontor Release-CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Version $NEU veröffentlicht [skip ci]" -- src/kontor/VERSION
          git tag -a "v$NEU" -m "Kontor $NEU"

      - name: Pakete bauen
        env:
          NEU: ${{ steps.version.outputs.neu }}
        run: |
          python -m kontor.release build src/kontor/build.json \
            --commit "$(git rev-parse HEAD)" --datum "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m build --outdir dist
          ls -l dist

      - name: Paket prüfen
        env:
          NEU: ${{ steps.version.outputs.neu }}
        run: |
          python -m venv /tmp/pruefung
          /tmp/pruefung/bin/pip install -q dist/*.whl
          /tmp/pruefung/bin/python -c "import kontor, kontor.version as v, sys; \
            assert kontor.__version__ == '$NEU', kontor.__version__; \
            b = v.build(); assert not b['entwicklungsstand'] and b['commit'], b; print(kontor.__version__, b)"

      - name: Pushen
        env:
          NEU: ${{ steps.version.outputs.neu }}
        run: git push --atomic origin HEAD:main "v$NEU"

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          NEU: ${{ steps.version.outputs.neu }}
        run: |
          gh release create "v$NEU" dist/* --verify-tag --title "Kontor $NEU" --generate-notes
