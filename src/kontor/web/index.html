<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1f5f8b">
<meta name="referrer" content="no-referrer">
<title>Kontor</title>
<link rel="manifest" href="/oeffentlich/manifest.webmanifest">
<link rel="icon" href="/oeffentlich/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/oeffentlich/icon-192.png">
<link rel="stylesheet" href="/oeffentlich/app.css">
<script type="module" src="/oeffentlich/app/haupt.js"></script>
</head>
<body class="modus-{{MODUS}}">
<!--MODUS-HINWEIS-->
<div id="app" class="app" data-testid="app" data-bereit="nein" data-layout="desktop">
  <header class="kopf" data-testid="app-kopf">
    <button type="button" class="kopf-knopf menue-knopf" id="menue-knopf" data-testid="menue-knopf"
            aria-label="Navigation einblenden" aria-controls="navigation" aria-expanded="false">&#9776;</button>
    <a class="marke" href="/" aria-label="Kontor – Finanzübersicht">Kontor</a>
    <form class="suche-kopf" id="suche-form" role="search" aria-label="Volltextsuche">
      <input type="search" id="suche-feld" data-testid="suche-feld" placeholder="Suchen … (/)"
             aria-label="Suchen in Konten, Empfängern, Tags und Buchungen" maxlength="200" enterkeyhint="search"
             autocomplete="off">
    </form>
    <div class="kopf-knoepfe">
      <button type="button" class="kopf-knopf" id="sync-starten" data-testid="sync-starten"
              aria-label="Bankkonten jetzt synchronisieren" title="Bankkonten jetzt synchronisieren">&#8635;</button>
      <button type="button" class="kopf-knopf" id="rueckgaengig-knopf" data-testid="rueckgaengig-knopf" disabled
              aria-label="Rückgängig (Strg+Z)" title="Rückgängig (Strg+Z)">&#8630;</button>
      <button type="button" class="kopf-knopf" id="wiederholen-knopf" data-testid="wiederholen-knopf" disabled
              aria-label="Wiederholen (Strg+Umschalt+Z)" title="Wiederholen (Strg+Umschalt+Z)">&#8631;</button>
      <button type="button" class="kopf-knopf" id="befehlspalette-knopf" data-testid="befehlspalette-knopf"
              aria-label="Befehlspalette (Strg+K)" title="Befehlspalette (Strg+K)">&#8984;</button>
      <a class="kopf-knopf glocke" id="benachrichtigungen-knopf" data-testid="benachrichtigungen-knopf"
         href="/benachrichtigungen" aria-label="Benachrichtigungen" title="Benachrichtigungen">&#128276;<span
         class="zahl-marke" id="benachrichtigungen-anzahl" data-testid="benachrichtigungen-anzahl"
         data-anzahl="0"></span></a>
    </div>
  </header>
  <div class="koerper">
    <nav class="navigation" id="navigation" data-testid="navigation" aria-label="Hauptnavigation">
      <a href="/" data-testid="nav-uebersicht">Finanzübersicht</a>
      <a href="/konten" data-testid="nav-konten">Konten</a>
      <a href="/kategorien" data-testid="nav-kategorien">Kategorien</a>
      <a href="/wiederkehrend" data-testid="nav-wiederkehrend">Wiederkehrende Buchungen</a>
      <a href="/kredite" data-testid="nav-kredite">Kredite</a>
      <a href="/berichte" data-testid="nav-berichte">Berichte</a>
      <a href="/import" data-testid="nav-import">Import</a>
      <a href="/einstellungen" data-testid="nav-einstellungen">Einstellungen</a>
      <a href="/protokoll" data-testid="nav-protokoll">Änderungsprotokoll</a>
      <a href="/empfaenger" data-testid="nav-empfaenger">Empfänger</a>
      <a href="/regeln" data-testid="nav-regeln">Regeln</a>
      <a href="/vorlagen" data-testid="nav-vorlagen">Split-Vorlagen</a>
      <a href="/dubletten" data-testid="nav-dubletten">Dubletten</a>
      <a href="/sync" data-testid="nav-sync">Synchronisation</a>
      <button type="button" class="version-knopf" id="version-knopf" data-testid="version-knopf" aria-haspopup="dialog"
              title="Über Kontor">Version {{VERSION}}</button>
    </nav>
    <div class="menue-hintergrund" id="menue-hintergrund" data-testid="menue-hintergrund" hidden></div>
    <main class="hauptbereich" id="hauptbereich" data-testid="hauptbereich" tabindex="-1">
      <noscript><p>Kontor benötigt JavaScript.</p></noscript>
    </main>
  </div>
  <div class="offline-hinweis" id="offline-hinweis" data-testid="offline-hinweis" role="status" hidden>
    Keine Verbindung zum Server – Kontor ist offline. Daten werden geladen, sobald die Verbindung zurück ist.
  </div>
  <div class="meldungen" id="meldungen" data-testid="meldungen" role="status" aria-live="polite"></div>
</div>
</body>
</html>
