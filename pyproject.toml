[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kontor"
dynamic = ["version"]
description = "Kontor – selbst gehostete Finanz-Web-App"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietär" }
dependencies = [
    "fastapi>=0.110",
    "starlette>=0.36",
    "python-multipart>=0.0.9",
    "uvicorn>=0.27",
    "reportlab>=4.0",
    "fints>=5.0",
    "cryptography>=42",
    "google-re2>=1.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0", "pytest-xdist>=3.5", "httpx>=0.27", "pypdf>=4.0", "hypothesis>=6.100", "jsonschema>=4.21",
    "rfc3339-validator>=0.1.4", "PyYAML>=6.0", "openapi-spec-validator>=0.7", "requests>=2.28", "playwright>=1.45",
]

[project.scripts]
kontor = "kontor.__main__:main"

[tool.setuptools.dynamic]
version = { file = "src/kontor/VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kontor = ["VERSION", "build.json", "web/*.html", "web/*.js", "web/oeffentlich/*", "web/oeffentlich/app/*", "web/oeffentlich/vendor/*", "betrieb/*", "mockdaten/*", "anbieter/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "core: schneller Test der Entwicklungsschleife (tests/core, zusammen unter 30 Sekunden)",
    "browser: Playwright-Test mit Chrome (tests/test_browser*.py, eigener CI-Job)",
]
