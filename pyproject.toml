[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kontor"
dynamic = ["version"]
description = "Kontor – selbst gehostete Finanz-Web-App (Meilensteine 1–10)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietär" }
dependencies = [
    "fastapi>=0.110",
    "starlette>=0.36",
    "python-multipart>=0.0.9",
    "uvicorn>=0.27",
    "reportlab>=4.0",
    "fints>=5.0",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27", "pypdf>=4.0"]

[project.scripts]
kontor = "kontor.__main__:main"

[tool.setuptools.dynamic]
version = { file = "src/kontor/VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kontor = ["VERSION", "build.json", "web/*.html", "web/*.js", "web/oeffentlich/*", "web/oeffentlich/app/*", "web/oeffentlich/vendor/*", "betrieb/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
